<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  #mvbox { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; display:flex; align-items:center; justify-content:center; padding:16px; }
  #mvbox .mvin { background:#fff; border-radius:16px; padding:18px; width:100%; max-width:520px; }
  #mvbox .mvt { font-size:20px; font-weight:700; margin-bottom:12px; }
  #mvbox .mvc { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  #mvbox .mvc button { min-width:64px; padding:12px 16px; font-size:24px; font-weight:700; }
  #mvbox .mvr { display:flex; gap:8px; margin-bottom:10px; }
  #mvbox .mvi { flex:1; min-width:0; font-size:22px; padding:10px; border:1px solid #ccc; border-radius:10px; }
  #mvbox .mvok { padding:10px 22px; font-size:20px; }
  #mvbox .mvno { width:100%; padding:10px; }
  .done.paidrow { background:#eef7ee; }
  .undopaid { background:none; border:1px solid #bbb; color:#888; font-size:12px; padding:2px 8px; border-radius:6px; min-height:0; width:auto; flex:none; }
  .paidb { display:inline-block; background:#2e7d32; color:#fff; font-weight:700; padding:2px 10px; border-radius:999px; font-size:15px; }
  #mvbox .splist { max-height:50vh; overflow:auto; margin-bottom:10px; border-top:1px solid #eee; }
  #mvbox .sprow { display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid #eee; font-size:20px; }
  #mvbox .sprow input { width:28px; height:28px; flex:none; }
  #mvbox .spn { flex:1; }
  #mvbox .spp { font-weight:700; }
  #mvbox .spdone { color:#aaa; }
  #mvbox .spdone .spn { text-decoration:line-through; }
  #mvbox .spsum { font-size:20px; font-weight:700; margin-bottom:10px; }
  #mvbox .spgo, #mvbox .spclr { width:100%; margin-bottom:8px; padding:12px; font-size:18px; }
  :root { --red:#a8231b; --ink:#231f1c; --muted:#7a716a; --bg:#f3eee6; --card:#fff; --line:#e3dacd; --warn:#d9822b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--red); color:#fff; padding:14px 20px; position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-size:22px; }
  #status { font-size:14px; opacity:.92; }
  main { padding:16px 20px 40px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
  .card { background:var(--card); border-radius:14px; padding:16px; border-top:6px solid var(--red); display:flex; flex-direction:column; }
  .card.late { border-top-color:var(--warn); }
  .card .tbl { font-size:26px; font-weight:800; }
  .card .meta { color:var(--muted); font-size:14px; margin:2px 0 10px; }
  .card .items { font-size:19px; line-height:1.6; flex:1; }
  .items .it { padding-left:1em; text-indent:-1em; }
  .items .qn { white-space:nowrap; }
  .items .st { background:#231f1c; color:#fff; border-radius:6px; padding:0 6px; margin:0 3px; font-weight:800; white-space:nowrap; }
  .items .q2 { background:#a8231b; color:#fff; border-radius:6px; padding:0 7px; font-weight:800; font-size:21px; }
  .card .note { background:#fff4d6; border-radius:8px; padding:8px 10px; margin-top:10px; font-size:15px; }
  .card .foot { display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
  .card .sum { font-size:17px; font-weight:700; }
  button { border:0; border-radius:10px; font-size:17px; font-weight:700; padding:12px 18px; background:var(--red); color:#fff; }
  button.ghost { background:#fff; color:var(--muted); border:1px solid var(--line); font-size:14px; padding:8px 12px; }
  .card .btns { display:flex; gap:8px; }
  .card .tbl .tno { background:#231f1c; color:#fff; border-radius:8px; padding:0 10px; margin-left:4px; }
  .card { transition: opacity .3s, transform .3s; }
  .card.leaving { opacity:0; transform:translateX(60px); pointer-events:none; }
  button { transition: transform .08s, filter .08s; -webkit-tap-highlight-color: transparent; }
  button:active { transform:scale(.94); filter:brightness(.8); }
  button.ok { background:#2e7d32; }
  button.print { background:#1d6fc2; color:#fff; border:1.5px solid #1d6fc2; font-size:15px; padding:10px 12px; }
  h2 { font-size:16px; color:var(--muted); margin:28px 0 10px; }
  button.back { font-size:16px; padding:12px 18px; border:1.5px solid var(--muted); border-radius:10px; min-width:150px; }
  button.back:disabled { opacity:.8; }
  .done { background:#fff; border-radius:10px; padding:10px 14px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; gap:10px; color:var(--muted); }
  .empty { text-align:center; color:var(--muted); padding:60px 0; font-size:18px; }
  .start { position:fixed; inset:0; background:rgba(35,31,28,.75); display:flex; align-items:center; justify-content:center; z-index:20; }
  .start[hidden] { display:none; }
  .start div { background:#fff; border-radius:16px; padding:28px; text-align:center; max-width:360px; }
  .err { background:#fde3e1; color:var(--red); padding:14px; border-radius:10px; margin-bottom:14px; }
  .printAll { display:block; width:100%; margin:0 0 14px; padding:16px; font-size:20px; font-weight:700; border:0; border-radius:12px; background:#1a1a1a; color:#fff; }
  .printAll[hidden] { display:none; }
  .printAll:active { transform:scale(.98); opacity:.85; }
  .card.call { background:#fff3c4; border-top-color:#e0a100 !important; }
  .card.call .items { font-size:1.2em; font-weight:700; }
  .tables { display:flex; flex-wrap:wrap; gap:10px; margin:0 0 14px; }
  .tables:empty { display:none; }
  .tchip { background:#fff; border-radius:12px; padding:8px 8px 8px 14px; display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); font-size:17px; }
  .tchip b.t { background:#231f1c; color:#fff; border-radius:7px; padding:0 9px; }
  .tchip .s { font-weight:800; }
  .tchip .n { color:var(--muted); font-size:14px; }
  .tchip button { font-size:15px; padding:9px 12px; background:#2e7d32; }
  .tchip button.bill { background:#1d6fc2; color:#fff; border:1.5px solid #1d6fc2; }
  .tchip button.split { background:#fff; color:#2e7d32; border:1.5px solid #2e7d32; }
</style>
</head>
<body data-api="https://script.google.com/macros/s/AKfycbwa-2vEjFBCXPFlnAeDj183ezOX0XGquyYTlFIgafLjcIAuQXsEXa7PYhIan-4oa4ildg/exec">
<header>
  <h1>注文一覧</h1>
  <span id="status">読み込み中…</span>
</header>
<main>
  <div id="err" class="err" hidden></div>
  <button id="printAll" class="printAll" hidden></button>
  <div id="tables" class="tables"></div>
  <div id="pending" class="grid"></div>
  <h2>完了（直近10件）</h2>
  <div id="done"></div>
</main>

<div class="start" id="start">
  <div>
    <p style="font-size:18px;font-weight:700;margin-top:0">受付を開始します</p>
    <p style="color:#7a716a;font-size:14px">新しい注文が来たら音でお知らせします。</p>
    <button id="go">受付開始</button>
  </div>
</div>

<script>
  const API = document.body.dataset.api;
  async function call(params, body) {
    const opt = body ? { method: 'POST', body: JSON.stringify(body), credentials: 'omit' } : { credentials: 'omit' };
    const url = body ? API : API + '?' + new URLSearchParams(params).toString();
    let r, err;
    for (let i = 0; i < (body ? 1 : 3); i++) {
      try { r = await fetch(url, opt); break; } catch (e) { err = e; await new Promise(s => setTimeout(s, 1500)); }
    }
    if (!r) throw err;
    let j;
    try { j = await r.json(); } catch (e) { if (body && body.action === 'status') return null; throw e; }
    if (!j.ok) throw new Error(j.error || '通信エラー');
    return j.data;
  }
  const BUILD = '20261013-1305'; // 画面を直したら必ず変える（iPadが自動で読み込み直す）
  const KEY = new URLSearchParams(location.search).get('key') || '';
  const $ = id => document.getElementById(id);
  const yen = n => '¥' + Number(n).toLocaleString();
  let actx = null, lastMax = 0, loaded = false, busy = false;

  function startAudio() {
    if (actx) return;
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  function begin() {
    $('start').hidden = true;
    load();
    setInterval(load, 8000);
    // 画面が新しくなっていたら自動で読み込み直す（再読み込みの手間をなくす）
    const chk = () => fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(t => {
      if (t.indexOf("const BUILD = '") > 0 && t.indexOf("const BUILD = '" + BUILD + "'") < 0 && !document.querySelector('.leaving'))
        location.replace(location.pathname + '?key=' + encodeURIComponent(KEY) + '&resume=1&v=' + Date.now());
    }).catch(() => {});
    chk(); setInterval(chk, 60000);
  }
  $('go').onclick = () => { startAudio(); begin(); };
  // 印刷アプリなどから戻ってきたら、すぐ最新の一覧にする
  document.addEventListener('visibilitychange', () => { if (!document.hidden && $('start').hidden) load(); });
  if (new URLSearchParams(location.search).get('resume')) {
    // 印刷できたら、その注文を提供済みにしてから一覧を表示する
    const pn = new URLSearchParams(location.search).get('printed');
    if (pn) {
      history.replaceState(null, '', location.pathname + '?key=' + encodeURIComponent(KEY) + '&resume=1&v=' + Date.now());
      Promise.all(pn.split(',').filter(Boolean).map(x => call(null, { action: 'status', key: KEY, no: isNaN(Number(x)) ? x : Number(x), status: '完了' }).catch(() => {}))).then(begin);
    } else begin();
    document.addEventListener('touchstart', startAudio, { once: true });
    document.addEventListener('click', startAudio, { once: true });
  }

  // ===== 伝票印刷（SII URL Print Agent） =====
  // 伝票用の短い品名（かっこ書き・容量を省く）
  const SHORT = [
    [/横浜名物 公珠サンマー麺/, 'サンマー麺'],
    [/生ビール 一口ジョッキ/, '生小'], [/生ビール 中ジョッキ/, '生中'],
    [/生ビール タワージョッキ/, 'タワー'], [/生ビール 寸胴ジョッキ/, '寸胴'],
    [/ノンアルコールビール/, 'ノンアル'], [/アサヒスーパードライ 中瓶/, 'SD中瓶'],
  ];
  function shortItems(text) {
    return String(text).split('\n').map(line => {
      let s = line;
      SHORT.forEach(([re, to]) => { s = s.replace(re, to); });
      s = s.replace(/（[^）]*）|\([^)]*\)/g, '').replace(/\s\d+ml/g, '').replace(/\s{2,}/g, ' ').trim();
      return s;
    }).join('\n');
  }
  function slipCanvas(o, part, pg, pn) {
    const W = 384, pad = 8, MAXW = 368, c = document.createElement('canvas'), g = c.getContext('2d');
    const font = (px, bold) => (bold ? '700 ' : '') + px + 'px "Hiragino Sans","Noto Sans JP",sans-serif';
    const lines = [];
    const wrap = (text, px, bold) => {
      g.font = font(px, bold);
      String(text).split('\n').forEach(raw => {
        // 「 × 数量」は途中で折り返さない
        const m = raw.match(/^(.*?)(\s×\s\d+)$/);
        const body = m ? m[1] : raw, tail = m ? m[2] : '';
        let cur = '';
        for (const ch of body) {
          if (g.measureText(cur + ch).width > MAXW) { lines.push([cur, px, bold]); cur = ch; }
          else cur += ch;
        }
        if (tail && g.measureText(cur + tail).width > MAXW) { lines.push([cur, px, bold]); cur = '　' + tail.trim(); }
        else cur += tail;
        lines.push([cur, px, bold]);
      });
    };
    if (part === 'bill') { wrap('■ お会計', 48, true); lines.push(['', 6, false]); }
    lines.push(['@', 48, true, 0, 0, [{ t: 'テーブル', hl: false }, { t: String(o.table), hl: true }]]);
    lines.push(['', 6, false]);
    wrap('No.' + o.no + '　' + o.time, 20, false);
    if (part === 'drink') wrap('■ ドリンク', 34, true);
    if (part === 'food') wrap('■ 料理', 34, true);
    if (part === 'gyoza') wrap('■ 餃子', 34, true);
    lines.push(['—', 14, false]);
    // 注意が必要な言葉（飲み方・濃いめ・大盛など）は白抜きにする
    const HL = /(ストレート|水割り|ロック|炭酸割り|烏龍割り|緑茶割り|ソーダ割り|燗|常温|濃いめ|大盛り|大盛|辛み増し|ボトル|赤(?=麻婆)|緑(?=麻婆)|サワー|ウーロンハイ|緑茶ハイ|持(?= ))/;
    (o._txt != null ? o._txt : part === 'drink' ? o.slipDrink : part === 'food' ? o.slipFood : (o.slip || shortItems(o.items))).split('\n').forEach(raw => {
      if (!raw.trim()) return;
      // 「＋雲呑3」など麺への追加は、前の料理にくっつけて1皿に見せる
      const isAdd = /^\s*＋/.test(raw);
      if (isAdd && lines.length && lines[lines.length - 1][0] === '' && lines[lines.length - 1][1] === 34) {
        lines.pop();
        for (let k = lines.length - 1; k >= 0; k--) if (lines[k][0] === '@') { lines[k][6] = 1.1; break; }
      }
      const px = part === 'bill' ? 28 : 42; g.font = font(px, true);
      const m = raw.match(/^(.*?)\s×\s(\d+)$/);
      const name = (isAdd ? '　' : '・') + (m ? m[1] : raw).trim().replace(/^持\)/, '持 '), q = m ? Number(m[2]) : 0;
      const ind = g.measureText('・').width;
      const segs = name.split(HL).map((t, i) => ({ t, hl: i % 2 === 1 })).filter(s => s.t);
      const rows = [[]]; let wsum = 0;
      const lim = () => MAXW - (rows.length > 1 ? ind : 0);
      const add = (t, hl, w) => { const r = rows[rows.length - 1]; const last = r[r.length - 1]; if (!hl && last && !last.hl) last.t += t; else r.push({ t, hl }); wsum += w; };
      const nl = () => { rows.push([]); wsum = 0; };
      segs.forEach(sg => {
        if (sg.hl) { const w = g.measureText(sg.t).width + 24; if (wsum + w > lim() && rows[rows.length - 1].length) nl(); add(sg.t, true, w); }
        else for (const ch of sg.t) { const w = g.measureText(ch).width; if (wsum + w > lim()) nl(); add(ch, false, w); }
      });
      if (q) { g.font = font(q >= 2 ? px + 4 : px, true); const qw = g.measureText('×' + q).width + (q >= 2 ? 24 : 10); g.font = font(px, true); if (wsum + qw > lim()) nl(); }
      // 同じ商品の折り返しは行間を詰め、商品と商品の間は広く空ける
      rows.forEach((r, i) => lines.push(['@', px, true, i ? ind : 0, i === rows.length - 1 ? q : 0, r, i < rows.length - 1 ? 1.08 : (part === 'bill' ? 1.25 : 1.35)]));
      lines.push(['', part === 'bill' ? 2 : 34, false]);
    });
    // 上海蟹の予約は、名前・日時・数を見やすく並べ、匹数は白抜きにする（グラム数と見間違えないように）
    const cm = String(o.table) === '予約' && String(o.note || '').match(/^【上海蟹予約】(.+?)様 TEL (\S+) (\S+) (\S+) (\d+)名 (.*?) 計(¥[\d,]+)(?: \/ ([\s\S]*))?$/);
    if (cm) {
      lines.push(['', 8, false]);
      wrap(cm[1] + ' 様', 34, true); wrap('TEL ' + cm[2], 26, false);
      wrap(cm[3] + ' ' + cm[4] + '　' + cm[5] + '名', 34, true);
      lines.push(['', 10, false]);
      cm[6].split(' ').filter(Boolean).forEach(t => { const k = t.match(/^(.*?)×(\d+)$/); if (k) lines.push(['@', 36, true, 0, 0, [{ t: '・' + k[1] + ' ', hl: false }, { t: k[2] + '匹', hl: true }], 1.6]); else wrap(t, 30, true); });
      lines.push(['', 6, false]);
      wrap('合計 ' + cm[7] + '（税込）', 26, false);
      if (cm[8]) wrap('ご要望：' + cm[8], 26, true);
    } else if (o.note && part !== 'drink' && part !== 'bill') { lines.push(['', 8, false]); wrap('備考：' + o.note, 26, true); }
    lines.push(['—', 14, false]);
    // 伝票が何枚かに分かれるときは、どの伝票にも「何枚目か」と注文全体の合計を出す
    // 台所の伝票には金額を出さない（金額は会計伝票で見る）。何枚かに分かれるときは何枚目かだけ出す
    if (part === 'bill') wrap('合計 ' + yen(o.total), 40, true);
    else if (pn > 1) wrap('伝票 ' + pg + '/' + pn + '枚', 22, false);
    const TOPM = part === 'bill' ? 40 : (part === 'gyoza' || part === 'drink') ? 24 : 120; // 伝票ホルダーに挟むための上の余白（約15mm。会計伝票は約5mm）
    const H = TOPM + pad * 2 + lines.reduce((a, l) => a + l[1] * (l[6] || 1.35), 0);
    c.width = W; c.height = Math.ceil(H);
    g.fillStyle = '#fff'; g.fillRect(0, 0, W, c.height);
    g.fillStyle = '#000'; g.textBaseline = 'top';
    let y = TOPM + pad;
    const box = (s, x, y, px) => { const w = g.measureText(s).width + 14; g.fillRect(x, y - 4, w, px + 8); g.fillStyle = '#fff'; g.fillText(s, x + 7, y); g.fillStyle = '#000'; return w; };
    lines.forEach(([t, px, bold, ind, q, segs, lh]) => {
      g.font = font(px, bold);
      if (t === '—') { g.fillRect(pad, y + px / 2, W - pad * 2, 2); }
      else {
        let x = pad + (ind || 0);
        if (segs) segs.forEach(sg => { if (sg.hl) x += box(sg.t, x + 5, y, px) + 10; else { g.fillText(sg.t, x, y); x += g.measureText(sg.t).width; } });
        else { g.fillText(t, x, y); x += g.measureText(t).width; }
        if (q) {
          const qx = x + 10;
          if (q >= 2) { g.font = font(px + 4, true); const w = g.measureText('×' + q).width + 14; g.fillRect(qx, y - 4, w, px + 8); g.fillStyle = '#fff'; g.fillText('×' + q, qx + 7, y - 2); g.fillStyle = '#000'; }
          else g.fillText('×' + q, qx, y);
        }
      }
      y += px * (lh || 1.35);
    });
    return c;
  }
  // 同じテーブルのまだ印刷していない注文は、1枚の伝票にまとめる（持帰・8番の予約は別のお客様なのでまとめない）
  let curPend = [];
  // お客様からの呼び出し（店員・取り皿・お水）は印刷しない
  const isCall = o => { const l = String(o.items || '').split('\n').filter(Boolean); return l.length > 0 && l.every(x => /^【(呼出|予約)】/.test(x)); };
  const NOMERGE = t => t === '持帰' || t === '8';
  function sumLines(arr) {
    const s = arr.filter(Boolean).join('\n');
    if (!s) return arr[0];
    const ord = [], q = {};
    s.split('\n').forEach(raw => {
      if (!raw.trim()) return;
      const m = raw.match(/^(.*?)\s×\s(\d+)$/);
      const k = m ? m[1] : raw;
      if (!(k in q)) { ord.push(k); q[k] = 0; }
      q[k] += m ? Number(m[2]) : 0;
    });
    return ord.map(k => q[k] ? k + ' × ' + q[k] : k).join('\n');
  }
  function mergeByTable(list) {
    const out = [], map = {};
    list.forEach(o => {
      const k = String(o.table);
      if (NOMERGE(k)) { out.push(o); return; }
      if (!map[k]) { map[k] = Object.assign({}, o, { _nos: [o.no] }); out.push(map[k]); return; }
      const m = map[k];
      if (!m.slip) m.slip = shortItems(m.items || []);
      const os = o.slip || shortItems(o.items || []);
      m._nos.push(o.no); m.no = m._nos.join('・');
      m.total = Number(m.total) + Number(o.total);
      m.slip = sumLines([m.slip, os]);
      m.slipFood = sumLines([m.slipFood, o.slipFood]);
      m.slipDrink = sumLines([m.slipDrink, o.slipDrink]);
      m.items = (m.items || []).concat(o.items || []);
      if (o.note) m.note = (m.note ? m.note + ' / ' : '') + o.note;
    });
    return out;
  }
  function printSlip(o) {
    const same = NOMERGE(String(o.table)) ? [o] : curPend.filter(x => String(x.table) === String(o.table));
    printSlips(same.length ? same : [o]);
  }
  // 同じテーブルの追加注文をたどって、そのお客様の合計を出す
  // お会計が済んだら席の「会計済み」を押す → そこから先の注文は次のお客様として数え直す
  // （押し忘れに備えて、最初の注文から5時間たったら自動で区切る。持帰・予約・8番は対象外）
  const PAIDKEY = 'kouju_paid_' + new Date().toDateString();

  // ===== 席変更：来店前に別の番号（8番など）で注文したお客様が、実際に座った席へ注文を移す =====

    seen.forEach(x => { const b = document.createElement('button'); b.textContent = x; b.onclick = () => go(x); bx.querySelector('.mvc').appendChild(b); });
    // 間違えて移したときは、最初の席に戻すボタンを一番前に出す
    { const fr = movedFrom_(o.no); if (fr && fr !== String(o.table)) { const b = document.createElement('button'); b.textContent = '↩ 元の席 ' + fr + ' に戻す'; b.style.cssText = 'background:#fff8dc;border:2px solid #f5b400;color:#231f1c;width:100%'; b.onclick = () => go(fr); bx.querySelector('.mvc').prepend(b); } }
    if (!bx.querySelector('.mvc').children.length) bx.querySelector('.mvc').remove();
    const go = v => {
      v = String(v || '').trim(); if (!v) { inp.focus(); return; }
      ok.disabled = true; ok.textContent = '⏳';
      call(null, { action: 'table', key: KEY, no: o.no, table: v })
        .then(() => { markMoved_(o.no, o.table); bx.remove(); all.forEach(x => { if (x.no === o.no) x.table = v; }); if (lastD) show(lastD); load(); })
        .catch(e => { ok.disabled = false; ok.textContent = '移す'; alert((e && e.message) || '席を変えられませんでした。もう一度押してください'); });
    };
    ok.onclick = () => go(inp.value);
    inp.onkeydown = e => { if (e.key === 'Enter') go(inp.value); };
    bx.querySelector('.mvno').onclick = () => bx.remove();
    bx.onclick = e => { if (e.target === bx) bx.remove(); };
    document.body.appendChild(bx);
  }

  // ===== 分けて会計：その席の品を1品ずつ並べ、払う人の分だけ選んで会計伝票を出す =====
  var priceOf_ = {};
  function splitKey_(t) { return 'kouju_split_' + new Date().toDateString() + '_' + t; }
  function splitDone_(t) { try { return JSON.parse(localStorage.getItem(splitKey_(t)) || '{}'); } catch (e) { return {}; } }
  function splitUnits_(r) {
    const units = [];
    r.run.slice().sort((a, b) => atOf(a) - atOf(b)).forEach(o => {
      const full = String(o.items || '').split('\n').filter(s => s.trim());
      const sl = String(o.slip || shortItems(o.items)).split('\n').filter(s => s.trim());
      const parsed = full.map((raw, i) => {
        const m = raw.match(/^(.*?)\s×\s(\d+)$/); const name = (m ? m[1] : raw).trim(); const q = m ? Number(m[2]) : 1;
        const sm = (sl[i] || '').match(/^(.*?)\s×\s(\d+)$/);
        return { name, q, label: sm ? sm[1].trim() : (sl[i] || name), price: priceOf_[name] };
      });
      // 値段がわからない品は、その注文の合計の残りを割り振る
      const known = parsed.reduce((a, p) => a + (p.price != null ? p.price * p.q : 0), 0);
      const unk = parsed.filter(p => p.price == null); const unkQ = unk.reduce((a, p) => a + p.q, 0);
      unk.forEach(p => { p.price = unkQ ? Math.round(Math.max(0, Number(o.total || 0) - known) / unkQ) : 0; });
      parsed.forEach((p, i) => { for (let k = 0; k < p.q; k++) units.push({ id: o.no + '-' + i + '-' + k, label: p.label, price: p.price }); });
    });
    return units;
  }
  function splitBill(t, r) {
    const old = document.getElementById('mvbox'); if (old) old.remove();
    const done = splitDone_(t), units = splitUnits_(r);
    const bx = document.createElement('div'); bx.id = 'mvbox';
    bx.innerHTML = '<div class="mvin"><div class="mvt"></div><div class="splist"></div><div class="spsum"></div><button class="mvok spgo">🖨 選んだ分の会計伝票</button><button class="ghost spclr">「済」を全部消す（やり直し）</button><button class="ghost mvno">閉じる</button></div>';
    bx.querySelector('.mvt').textContent = 'テーブル ' + t + '：払う人の分を選んでください';
    const list = bx.querySelector('.splist'); const sel = new Set();
    const upd = () => {
      const s = units.filter(u => sel.has(u.id)).reduce((a, u) => a + u.price, 0);
      const rest = units.filter(u => !done[u.id]).reduce((a, u) => a + u.price, 0);
      bx.querySelector('.spsum').textContent = '選んだ分 ' + yen(s) + '　／　まだの分 ' + yen(rest);
      bx.querySelector('.spgo').disabled = !sel.size;
    };
    units.forEach(u => {
      const row = document.createElement('label'); row.className = 'sprow' + (done[u.id] ? ' spdone' : '');
      row.innerHTML = '<input type="checkbox"><span class="spn"></span><span class="spp"></span>';
      row.querySelector('.spn').textContent = u.label + (done[u.id] ? '（済）' : '');
      row.querySelector('.spp').textContent = yen(u.price);
      const cb = row.querySelector('input'); cb.onchange = () => { if (cb.checked) sel.add(u.id); else sel.delete(u.id); upd(); };
      list.appendChild(row);
    });
    upd();
    bx.querySelector('.spgo').onclick = () => {
      const pick = units.filter(u => sel.has(u.id)); if (!pick.length) return;
      const d2 = splitDone_(t); pick.forEach(u => { d2[u.id] = 1; }); try { localStorage.setItem(splitKey_(t), JSON.stringify(d2)); } catch (e) {}
      const run = r.run.slice().sort((a, b) => atOf(a) - atOf(b));
      sendBill_({ table: t, no: run.map(x => x.no).join('・'), time: run[0].time + '〜' + run[run.length - 1].time,
        total: pick.reduce((a, u) => a + u.price, 0), _txt: sumLines(pick.map(u => u.label + ' × 1')) });
    };
    bx.querySelector('.spclr').onclick = () => { try { localStorage.removeItem(splitKey_(t)); } catch (e) {} splitBill(t, r); };
    bx.querySelector('.mvno').onclick = () => bx.remove();
    document.body.appendChild(bx);
  }

  const hiding = new Set();
  function doneNow(no, card, btn) {
    hiding.add(no); forced.delete(no);
    btn.disabled = true; btn.textContent = '✓ 提供済み'; btn.classList.add('ok');
    setTimeout(() => card.classList.add('leaving'), 150);
    setTimeout(() => {
      card.remove();
      if (!$('pending').querySelector('.card')) $('pending').innerHTML = '<div class="empty">未対応の注文はありません</div>';
    }, 480);
    call(null, { action: 'status', key: KEY, no, status: '完了' })
      .then(() => { hiding.delete(no); load(); })
      .catch(e => { hiding.delete(no); alert('No.' + no + ' を提供済みにできませんでした。もう一度押してください'); load(); });
  }
  // 「未対応に戻す」：押したらすぐ「戻しています…」と出し、戻ったら上の一覧に黄色で光らせる
  const restoring = new Set(); let flashNo = null;
  function setStatus(no, status, btn) {
    btn.disabled = true; btn.textContent = '⏳ 戻しています…'; unmarkPrinted(no);
    const o = lastD && lastD.done.find(x => x.no === no);
    if (o) { forced.set(no, Object.assign({}, o, { status: '未対応', _t: Date.now() })); flashNo = no; setTimeout(() => { flashNo = null; }, 8000); window.scrollTo(0, 0); show(lastD); }
    else restoring.add(no);
    call(null, { action: 'status', key: KEY, no, status })
      .then(() => { restoring.delete(no); load(); })
      .catch(e => { restoring.delete(no); forced.delete(no); if (lastD) show(lastD); alert((e && e.message) || 'No.' + no + ' を戻せませんでした。もう一度押してください'); });
  }
</script>

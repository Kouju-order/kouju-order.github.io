<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>注文一覧｜公珠</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root { --red:#a8231b; --ink:#231f1c; --muted:#7a716a; --bg:#f3eee6; --card:#fff; --line:#e3dacd; --warn:#d9822b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--red); color:#fff; padding:14px 20px; position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-size:22px; }
  #status { font-size:14px; opacity:.92; }
  main { padding:16px 20px 40px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
  .card { background:var(--card); border-radius:14px; padding:16px; border-top:6px solid var(--red); display:flex; flex-direction:column; }
  .card.late { border-top-color:var(--warn); }
  .card .tbl { font-size:26px; font-weight:800; }
  .card .meta { color:var(--muted); font-size:14px; margin:2px 0 10px; }
  .card .items { font-size:19px; line-height:1.6; flex:1; }
  .items .it { padding-left:1em; text-indent:-1em; }
  .items .qn { white-space:nowrap; }
  .items .st { background:#231f1c; color:#fff; border-radius:6px; padding:0 6px; margin:0 3px; font-weight:800; white-space:nowrap; }
  .items .q2 { background:#a8231b; color:#fff; border-radius:6px; padding:0 7px; font-weight:800; font-size:21px; }
  .card .note { background:#fff4d6; border-radius:8px; padding:8px 10px; margin-top:10px; font-size:15px; }
  .card .foot { display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
  .card .sum { font-size:17px; font-weight:700; }
  button { border:0; border-radius:10px; font-size:17px; font-weight:700; padding:12px 18px; background:var(--red); color:#fff; }
  button.ghost { background:#fff; color:var(--muted); border:1px solid var(--line); font-size:14px; padding:8px 12px; }
  .card .btns { display:flex; gap:8px; }
  .card .tbl .tno { background:#231f1c; color:#fff; border-radius:8px; padding:0 10px; margin-left:4px; }
  .card { transition: opacity .3s, transform .3s; }
  .card.leaving { opacity:0; transform:translateX(60px); pointer-events:none; }
  button { transition: transform .08s, filter .08s; -webkit-tap-highlight-color: transparent; }
  button:active { transform:scale(.94); filter:brightness(.8); }
  button.ok { background:#2e7d32; }
  button.print { background:#fff; color:var(--red); border:1.5px solid var(--red); font-size:15px; padding:10px 12px; }
  h2 { font-size:16px; color:var(--muted); margin:28px 0 10px; }
  .done { background:#fff; border-radius:10px; padding:10px 14px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; gap:10px; color:var(--muted); }
  .empty { text-align:center; color:var(--muted); padding:60px 0; font-size:18px; }
  .start { position:fixed; inset:0; background:rgba(35,31,28,.75); display:flex; align-items:center; justify-content:center; z-index:20; }
  .start[hidden] { display:none; }
  .start div { background:#fff; border-radius:16px; padding:28px; text-align:center; max-width:360px; }
  .err { background:#fde3e1; color:var(--red); padding:14px; border-radius:10px; margin-bottom:14px; }
  .printAll { display:block; width:100%; margin:0 0 14px; padding:16px; font-size:20px; font-weight:700; border:0; border-radius:12px; background:#1a1a1a; color:#fff; }
  .printAll[hidden] { display:none; }
  .printAll:active { transform:scale(.98); opacity:.85; }
</style>
</head>
<body data-api="https://script.google.com/macros/s/AKfycbwa-2vEjFBCXPFlnAeDj183ezOX0XGquyYTlFIgafLjcIAuQXsEXa7PYhIan-4oa4ildg/exec">
<header>
  <h1>注文一覧</h1>
  <span id="status">読み込み中…</span>
</header>
<main>
  <div id="err" class="err" hidden></div>
  <button id="printAll" class="printAll" hidden></button>
  <div id="pending" class="grid"></div>
  <h2>完了（直近10件）</h2>
  <div id="done"></div>
</main>

<div class="start" id="start">
  <div>
    <p style="font-size:18px;font-weight:700;margin-top:0">受付を開始します</p>
    <p style="color:#7a716a;font-size:14px">新しい注文が来たら音でお知らせします。</p>
    <button id="go">受付開始</button>
  </div>
</div>

<script>
  const API = document.body.dataset.api;
  async function call(params, body) {
    const opt = body ? { method: 'POST', body: JSON.stringify(body), credentials: 'omit' } : { credentials: 'omit' };
    const url = body ? API : API + '?' + new URLSearchParams(params).toString();
    let r, err;
    for (let i = 0; i < (body ? 1 : 3); i++) {
      try { r = await fetch(url, opt); break; } catch (e) { err = e; await new Promise(s => setTimeout(s, 1500)); }
    }
    if (!r) throw err;
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '通信エラー');
    return j.data;
  }
  const BUILD = '20261009-2240'; // 画面を直したら必ず変える（iPadが自動で読み込み直す）
  const KEY = new URLSearchParams(location.search).get('key') || '';
  const $ = id => document.getElementById(id);
  const yen = n => '¥' + Number(n).toLocaleString();
  let actx = null, lastMax = 0, loaded = false, busy = false;

  function startAudio() {
    if (actx) return;
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  function begin() {
    $('start').hidden = true;
    load();
    setInterval(load, 8000);
    // 画面が新しくなっていたら自動で読み込み直す（再読み込みの手間をなくす）
    const chk = () => fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(t => {
      if (t.indexOf("const BUILD = '") > 0 && t.indexOf("const BUILD = '" + BUILD + "'") < 0 && !document.querySelector('.leaving'))
        location.replace(location.pathname + '?key=' + encodeURIComponent(KEY) + '&resume=1&v=' + Date.now());
    }).catch(() => {});
    chk(); setInterval(chk, 60000);
  }
  $('go').onclick = () => { startAudio(); begin(); };
  if (new URLSearchParams(location.search).get('resume')) {
    // 印刷できたら、その注文を提供済みにしてから一覧を表示する
    const pn = new URLSearchParams(location.search).get('printed');
    if (pn) {
      history.replaceState(null, '', location.pathname + '?key=' + encodeURIComponent(KEY) + '&resume=1&v=' + Date.now());
      Promise.all(pn.split(',').filter(Boolean).map(x => call(null, { action: 'status', key: KEY, no: isNaN(Number(x)) ? x : Number(x), status: '完了' }).catch(() => {}))).then(begin);
    } else begin();
    document.addEventListener('touchstart', startAudio, { once: true });
    document.addEventListener('click', startAudio, { once: true });
  }

  // ===== 伝票印刷（SII URL Print Agent） =====
  // 伝票用の短い品名（かっこ書き・容量を省く）
  const SHORT = [
    [/横浜名物 公珠サンマー麺/, 'サンマー麺'],
    [/生ビール 一口ジョッキ/, '生小'], [/生ビール 中ジョッキ/, '生中'],
    [/生ビール タワージョッキ/, 'タワー'], [/生ビール 寸胴ジョッキ/, '寸胴'],
    [/ノンアルコールビール/, 'ノンアル'], [/アサヒスーパードライ 中瓶/, 'SD中瓶'],
  ];
  function shortItems(text) {
    return String(text).split('\n').map(line => {
      let s = line;
      SHORT.forEach(([re, to]) => { s = s.replace(re, to); });
      s = s.replace(/（[^）]*）|\([^)]*\)/g, '').replace(/\s\d+ml/g, '').replace(/\s{2,}/g, ' ').trim();
      return s;
    }).join('\n');
  }
  function slipCanvas(o, part) {
    const W = 384, pad = 8, MAXW = 368, c = document.createElement('canvas'), g = c.getContext('2d');
    const font = (px, bold) => (bold ? '700 ' : '') + px + 'px "Hiragino Sans","Noto Sans JP",sans-serif';
    const lines = [];
    const wrap = (text, px, bold) => {
      g.font = font(px, bold);
      String(text).split('\n').forEach(raw => {
        // 「 × 数量」は途中で折り返さない
        const m = raw.match(/^(.*?)(\s×\s\d+)$/);
        const body = m ? m[1] : raw, tail = m ? m[2] : '';
        let cur = '';
        for (const ch of body) {
          if (g.measureText(cur + ch).width > MAXW) { lines.push([cur, px, bold]); cur = ch; }
          else cur += ch;
        }
        if (tail && g.measureText(cur + tail).width > MAXW) { lines.push([cur, px, bold]); cur = '　' + tail.trim(); }
        else cur += tail;
        lines.push([cur, px, bold]);
      });
    };
    lines.push(['@', 48, true, 0, 0, [{ t: 'テーブル', hl: false }, { t: String(o.table), hl: true }]]);
    lines.push(['', 6, false]);
    wrap('No.' + o.no + '　' + o.time, 20, false);
    if (part === 'drink') wrap('■ ドリンク', 34, true);
    if (part === 'food') wrap('■ 料理', 34, true);
    lines.push(['—', 14, false]);
    // 注意が必要な言葉（飲み方・濃いめ・大盛など）は白抜きにする
    const HL = /(ストレート|水割り|ロック|炭酸割り|烏龍割り|緑茶割り|ソーダ割り|燗|常温|濃いめ|大盛り|大盛|辛み増し|ボトル|赤(?=麻婆)|緑(?=麻婆))/;
    (part === 'drink' ? o.slipDrink : part === 'food' ? o.slipFood : (o.slip || shortItems(o.items))).split('\n').forEach(raw => {
      if (!raw.trim()) return;
      const px = 42; g.font = font(px, true);
      const m = raw.match(/^(.*?)\s×\s(\d+)$/);
      const name = '・' + (m ? m[1] : raw).trim(), q = m ? Number(m[2]) : 0;
      const ind = g.measureText('・').width;
      const segs = name.split(HL).map((t, i) => ({ t, hl: i % 2 === 1 })).filter(s => s.t);
      const rows = [[]]; let wsum = 0;
      const lim = () => MAXW - (rows.length > 1 ? ind : 0);
      const add = (t, hl, w) => { const r = rows[rows.length - 1]; const last = r[r.length - 1]; if (!hl && last && !last.hl) last.t += t; else r.push({ t, hl }); wsum += w; };
      const nl = () => { rows.push([]); wsum = 0; };
      segs.forEach(sg => {
        if (sg.hl) { const w = g.measureText(sg.t).width + 24; if (wsum + w > lim() && rows[rows.length - 1].length) nl(); add(sg.t, true, w); }
        else for (const ch of sg.t) { const w = g.measureText(ch).width; if (wsum + w > lim()) nl(); add(ch, false, w); }
      });
      if (q) { g.font = font(q >= 2 ? px + 4 : px, true); const qw = g.measureText('×' + q).width + (q >= 2 ? 24 : 10); g.font = font(px, true); if (wsum + qw > lim()) nl(); }
      // 同じ商品の折り返しは行間を詰め、商品と商品の間は広く空ける
      rows.forEach((r, i) => lines.push(['@', px, true, i ? ind : 0, i === rows.length - 1 ? q : 0, r, i < rows.length - 1 ? 1.08 : 1.35]));
      lines.push(['', 34, false]);
    });
    if (o.note && part !== 'drink') { lines.push(['', 8, false]); wrap('備考：' + o.note, 26, true); }
    lines.push(['—', 14, false]);
    if (part !== 'drink') wrap('合計 ' + yen(o.total), 26, false);
    const TOPM = 120; // 伝票ホルダーに挟むための上の余白（約15mm）
    const H = TOPM + pad * 2 + lines.reduce((a, l) => a + l[1] * (l[6] || 1.35), 0);
    c.width = W; c.height = Math.ceil(H);
    g.fillStyle = '#fff'; g.fillRect(0, 0, W, c.height);
    g.fillStyle = '#000'; g.textBaseline = 'top';
    let y = TOPM + pad;
    const box = (s, x, y, px) => { const w = g.measureText(s).width + 14; g.fillRect(x, y - 4, w, px + 8); g.fillStyle = '#fff'; g.fillText(s, x + 7, y); g.fillStyle = '#000'; return w; };
    lines.forEach(([t, px, bold, ind, q, segs, lh]) => {
      g.font = font(px, bold);
      if (t === '—') { g.fillRect(pad, y + px / 2, W - pad * 2, 2); }
      else {
        let x = pad + (ind || 0);
        if (segs) segs.forEach(sg => { if (sg.hl) x += box(sg.t, x + 5, y, px) + 10; else { g.fillText(sg.t, x, y); x += g.measureText(sg.t).width; } });
        else { g.fillText(t, x, y); x += g.measureText(t).width; }
        if (q) {
          const qx = x + 10;
          if (q >= 2) { g.font = font(px + 4, true); const w = g.measureText('×' + q).width + 14; g.fillRect(qx, y - 4, w, px + 8); g.fillStyle = '#fff'; g.fillText('×' + q, qx + 7, y - 2); g.fillStyle = '#000'; }
          else g.fillText('×' + q, qx, y);
        }
      }
      y += px * (lh || 1.35);
    });
    return c;
  }
  function printSlip(o) { printSlips([o]); }
  // 何件かの伝票を1回でまとめて印刷する
  function printSlips(list) {
    try {
      const wmm = 48; let pdf = null;
      list.forEach(o => {
      // 料理とドリンクが両方あるときは2枚に分ける
      const parts = (o.slipFood && o.slipDrink) ? ['food', 'drink'] : [null];
      parts.forEach(p => {
        const c = slipCanvas(o, p); const hmm = wmm * c.height / c.width;
        const ori = hmm >= wmm ? 'portrait' : 'landscape';
        if (!pdf) pdf = new window.jspdf.jsPDF({ unit: 'mm', format: [wmm, hmm], orientation: ori });
        else pdf.addPage([wmm, hmm], ori);
        pdf.addImage(c.toDataURL('image/jpeg', 0.85), 'JPEG', 0, 0, wmm, hmm);
      });
      });
      const b64 = pdf.output('datauristring').split(',')[1];
      const back = location.origin + location.pathname + '?key=' + encodeURIComponent(KEY) + '&resume=1&v=' + Date.now();
      location.href = 'siiprintagent://1.0/print?Format=pdf&PaperWidth=58&FitToWidth=yes&CutType=partial&BtKeepConnect=always&ErrorDialog=yes'
        + '&CallbackSuccess=' + encodeURIComponent(back + '&printed=' + encodeURIComponent(list.map(o => o.no).join(','))) + '&CallbackFail=' + encodeURIComponent(back)
        + '&Data=' + encodeURIComponent(b64);
    } catch (e) {
      alert('伝票を作れませんでした：' + e.message);
    }
  }

  function beep() {
    if (!actx) return;
    [0, 0.25, 0.5].forEach((t, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = i === 1 ? 1175 : 880;
      g.gain.setValueAtTime(0.0001, actx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.4, actx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + t + 0.2);
      o.connect(g).connect(actx.destination);
      o.start(actx.currentTime + t); o.stop(actx.currentTime + t + 0.22);
    });
  }

  function load() {
    if (busy) return;
    busy = true;
    call({ api: 'orders', key: KEY })
      .then(d => { busy = false; $('err').hidden = true; show(d); })
      .catch(e => {
        busy = false;
        $('err').textContent = (e && e.message) || '読み込みに失敗しました';
        $('err').hidden = false;
      });
  }

  function show(d) {
    const maxAt = d.pending.reduce((a, o) => Math.max(a, o.at), 0);
    if (loaded && maxAt > lastMax) beep();
    lastMax = Math.max(lastMax, maxAt);
    loaded = true;

    const now = Date.now();
    const p = $('pending'); p.innerHTML = '';
    const pend = d.pending.filter(o => !hiding.has(o.no));
    if (!pend.length) p.innerHTML = '<div class="empty">未対応の注文はありません</div>';
    const pa = $('printAll'); const sorted = pend.slice().sort((a, b) => a.at - b.at);
    pa.hidden = sorted.length < 2; pa.textContent = '🖨 まとめて印刷（' + sorted.length + '件）';
    pa.onclick = () => printSlips(sorted);
    sorted.forEach(o => {
      const mins = Math.floor((now - o.at) / 60000);
      const c = document.createElement('div');
      c.className = 'card' + (mins >= 15 ? ' late' : '');
      c.innerHTML = '<div class="tbl"></div><div class="meta"></div><div class="items"></div>' +
        '<div class="foot"><span class="sum"></span><div class="btns"><button class="print">伝票印刷</button><button class="doneBtn">提供済み</button></div></div>';
      { const tb = c.querySelector('.tbl'); tb.textContent = 'テーブル '; const b = document.createElement('b'); b.className = 'tno'; b.textContent = o.table; tb.appendChild(b); }
      c.querySelector('.meta').textContent = `No.${o.no}　${o.time}　${mins < 1 ? 'たった今' : mins + '分前'}`;
      const box = c.querySelector('.items');
      (o.slip || shortItems(o.items)).split('\n').forEach(raw => {
        if (!raw.trim()) return;
        const m = raw.match(/^(.*?)\s×\s(\d+)$/);
        const row = document.createElement('div'); row.className = 'it';
        const HL = /(ストレート|水割り|ロック|炭酸割り|烏龍割り|緑茶割り|ソーダ割り|燗|常温|濃いめ|大盛り|大盛|辛み増し|ボトル|赤(?=麻婆)|緑(?=麻婆))/;
        row.appendChild(document.createTextNode('・'));
        (m ? m[1] : raw).trim().split(HL).forEach((t, i) => {
          if (!t) return;
          if (i % 2 === 1) { const sp = document.createElement('span'); sp.className = 'st'; sp.textContent = t; row.appendChild(sp); }
          else row.appendChild(document.createTextNode(t));
        });
        row.appendChild(document.createTextNode(' '));
        if (m) { const s = document.createElement('span'); s.className = Number(m[2]) >= 2 ? 'qn q2' : 'qn'; s.textContent = '×' + m[2]; row.appendChild(s); }
        box.appendChild(row);
      });
      if (o.note) {
        const n = document.createElement('div'); n.className = 'note'; n.textContent = '📝 ' + o.note;
        c.querySelector('.items').after(n);
      }
      c.querySelector('.sum').textContent = yen(o.total);
      c.querySelector('.doneBtn').onclick = e => doneNow(o.no, c, e.currentTarget);
      c.querySelector('.print').onclick = () => printSlip(o);
      p.appendChild(c);
    });

    const dn = $('done'); dn.innerHTML = '';
    d.done.forEach(o => {
      const r = document.createElement('div'); r.className = 'done';
      const s = document.createElement('span');
      s.textContent = `No.${o.no}　テーブル ${o.table}　${o.time}　${yen(o.total)}`;
      const b = document.createElement('button'); b.className = 'ghost'; b.textContent = '未対応に戻す';
      b.onclick = () => setStatus(o.no, '未対応', b);
      r.append(s, b); dn.appendChild(r);
    });

    const t = new Date();
    $('status').textContent = '最終更新 ' + t.toTimeString().slice(0, 8);
  }

  const hiding = new Set();
  function doneNow(no, card, btn) {
    hiding.add(no);
    btn.disabled = true; btn.textContent = '✓ 提供済み'; btn.classList.add('ok');
    setTimeout(() => card.classList.add('leaving'), 150);
    setTimeout(() => {
      card.remove();
      if (!$('pending').querySelector('.card')) $('pending').innerHTML = '<div class="empty">未対応の注文はありません</div>';
    }, 480);
    call(null, { action: 'status', key: KEY, no, status: '完了' })
      .then(() => { hiding.delete(no); load(); })
      .catch(e => { hiding.delete(no); alert('No.' + no + ' を提供済みにできませんでした。もう一度押してください'); load(); });
  }
  function setStatus(no, status, btn) {
    btn.disabled = true;
    call(null, { action: 'status', key: KEY, no, status })
      .then(load)
      .catch(e => { btn.disabled = false; alert((e && e.message) || '更新できませんでした'); });
  }
</script>
</body>
</html>

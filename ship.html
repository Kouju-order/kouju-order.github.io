<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冷凍品の発送受付｜公珠</title>
<meta name="robots" content="noindex">
<style>
:root{--red:#b5262b;--ink:#2a1a14;--sub:#6b5548;--bg:#fffaf0;--line:#e7d6bf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.55}
header{background:var(--red);color:#fff;padding:12px 16px}
header h1{margin:0;font-size:18px}
.prog{display:flex;gap:6px;margin-top:8px}
.prog span{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.35)}
.prog span.on{background:#fff}
main{max-width:560px;margin:0 auto;padding:16px 16px 130px}
.q{font-size:22px;font-weight:800;margin:4px 0 4px}
.qs{color:var(--sub);font-size:14px;margin:0 0 14px}
.who{display:inline-block;background:#fde3e3;color:var(--red);font-weight:800;border-radius:99px;padding:2px 12px;font-size:14px;margin-bottom:6px}
label{display:block;font-size:14px;font-weight:700;color:var(--sub);margin:12px 0 4px}
input,select{width:100%;font:inherit;font-size:17px;padding:12px;border:1.5px solid #d9c6ad;border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--red)}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font:inherit;font-weight:800;font-size:17px;cursor:pointer;text-align:center}
.main{background:var(--red);color:#fff}
.sub{background:#fff;color:var(--red);border:2px solid var(--red)}
.big{background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px;text-align:left;width:100%;font:inherit;cursor:pointer;margin-bottom:10px;display:flex;gap:12px;align-items:center;color:var(--ink)}
.big b{font-size:18px;display:block}
.big small{color:var(--sub);font-size:13px}
.big .ic{font-size:34px}
.howto{background:#fff;border:1.5px dashed var(--red);border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:15px}
.howto ol{margin:6px 0 0;padding-left:22px}.howto li{margin:4px 0}
.link{background:none;border:0;color:var(--sub);text-decoration:underline;font:inherit;font-size:14px;padding:8px 0;cursor:pointer}
.items{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.it{display:flex;align-items:center;gap:8px;padding:10px;border-top:1px solid #f1e6d6}
.gh{background:var(--red);color:#fff;font-weight:800;font-size:15px;padding:7px 12px}
.it:first-child,.gh+.it{border-top:0}
.it.on{background:#fff4e8}
.it .nm{flex:1;font-size:15px;line-height:1.35}
.it .nm small{display:block;color:var(--sub);font-size:13px}
.it .qb{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--red);background:#fff;color:var(--red);font-size:21px;font-weight:800;line-height:1;padding:0;cursor:pointer}
.it .qb.p{background:var(--red);color:#fff}
.it .qty{min-width:24px;text-align:center;font-weight:800;font-size:18px}
.isum{padding:12px;background:#fbf3e6;font-weight:800;text-align:right;font-size:16px}
.msg{color:var(--red);font-weight:700;font-size:14px;margin:6px 0}
details{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:14px}
summary{font-weight:700;cursor:pointer;color:var(--sub)}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,250,240,.97);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.bar .btn{max-width:560px}
.bar .back{flex:0 0 96px;background:#f4ebdd;color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:15px}
.card h3{margin:0 0 6px;font-size:16px}
.card .e{float:right;font-size:13px}
.done{text-align:center}
.done .no{font-size:30px;font-weight:900;color:var(--red);margin:8px 0}
.tot{border-top:2px solid var(--red);padding:10px 0;font-weight:800;font-size:18px;text-align:right}
[hidden]{display:none!important}
</style>
</head>
<body data-api="https://script.google.com/macros/s/AKfycbwa-2vEjFBCXPFlnAeDj183ezOX0XGquyYTlFIgafLjcIAuQXsEXa7PYhIan-4oa4ildg/exec">
<header><h1>🧊 冷凍品の発送受付　公珠</h1><div class="prog" id="prog"><span></span><span></span><span></span><span></span><span></span></div></header>
<main id="main"></main>
<div class="bar" id="bar"><button class="btn back" id="back">戻る</button><button class="btn main" id="next">次へ</button></div>
<input type="file" id="vcf" accept=".vcf,text/vcard,text/x-vcard,text/directory" hidden>
<script>
(function(){
  const API = document.body.dataset.api;
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const yen = n => '¥' + Number(n || 0).toLocaleString();
  const NUM = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
  const PREF = ['','北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];
  const z2h = s => String(s || '').replace(/[０-９－ー‐−]/g, c => ({'－':'-','ー':'-','‐':'-','−':'-'}[c] || String.fromCharCode(c.charCodeAt(0) - 0xFEE0)));
  const zipNorm = s => { const d = z2h(s).replace(/\D/g, ''); return d.length === 7 ? d.slice(0,3) + '-' + d.slice(3) : z2h(s).trim(); };
  const telNorm = s => { let v = z2h(s).replace(/^\+81[\s-]?\(?0?/, '0').replace(/[\s()]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '').replace(/[^\d-]/g, ''); const d = v.replace(/\D/g, ''); if (!/-/.test(v) && d.length === 11) v = d.slice(0,3) + '-' + d.slice(3,7) + '-' + d.slice(7); return v; };
  const prefOf = a => PREF.find(p => p && String(a || '').startsWith(p)) || '';
  const TL = { '':'指定なし','0812':'午前中','1416':'14〜16時','1618':'16〜18時','1820':'18〜20時','1921':'19〜21時' };

  // 郵便番号 → 住所
  const zcache = {};
  function zipLookup(zip7){
    const k = zip7.slice(0,3);
    if (zcache[k]) return Promise.resolve(zcache[k][zip7]);
    return new Promise(res => {
      window.$yubin = data => { zcache[k] = data; res(data[zip7]); };
      const sc = document.createElement('script');
      sc.src = 'https://yubinbango.github.io/yubinbango-data/data/' + k + '.js';
      sc.onerror = () => res(null);
      document.head.appendChild(sc); setTimeout(() => sc.remove(), 5000);
    });
  }

  // 連絡先ファイル（vCard）
  function parseVcard(txt){
    txt = String(txt || '').replace(/\r\n/g, '\n').replace(/\n[ \t]/g, '');
    if (!/BEGIN:VCARD/i.test(txt)) return null;
    const card = txt.split(/END:VCARD/i)[0];
    const un = v => v.replace(/\\n/gi, ' ').replace(/\\([,;\\])/g, '$1').trim();
    const props = [];
    card.split('\n').forEach(l => { const m = l.match(/^(?:[\w-]+\.)?([A-Z-]+)((?:;[^:]*)?):(.*)$/i); if (m) props.push({ k: m[1].toUpperCase(), p: m[2] || '', v: m[3] }); });
    const get = k => props.filter(x => x.k === k);
    const o = {};
    const n = get('N')[0];
    if (n) { const a = n.v.split(';').map(un); o.name = [a[0], a[1]].filter(Boolean).join(' '); }
    if (!o.name && get('FN')[0]) o.name = un(get('FN')[0].v);
    const kl = get('X-PHONETIC-LAST-NAME')[0], kf = get('X-PHONETIC-FIRST-NAME')[0];
    const kana = [kl && un(kl.v), kf && un(kf.v)].filter(Boolean).join(' ');
    if (kana) o.kana = kana.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
    const tels = get('TEL'); const tl = tels.find(x => /CELL|IPHONE|MOBILE/i.test(x.p)) || tels[0];
    if (tl) o.tel = telNorm(un(tl.v).replace(/^tel:/i, ''));
    const ads = get('ADR'); const ad = ads.find(x => /HOME/i.test(x.p)) || ads[0];
    if (ad) {
      const a = ad.v.split(';').map(un);
      const zip = z2h(a[5] || '').replace(/\D/g, '');
      if (zip.length === 7) o.zip = zip.slice(0,3) + '-' + zip.slice(3);
      o.addr = z2h([a[4], a[3], a[2]].filter(Boolean).join('')).replace(/\s+/g, '').replace(/^日本/, '');
      o.bldg = z2h(a[1] || '').trim();
    }
    return (o.name || o.tel || o.addr) ? o : null;
  }

  // 冷凍の商品一覧
  let FROZEN = null;
  const menuP = fetch(API + '?api=menu', { credentials: 'omit' }).then(r => r.json())
    .then(r => { FROZEN = ((r && r.data) || []).filter(m => m.cat === 'テイクアウト 冷凍' && !/保冷/.test(m.name)); })
    .catch(() => { FROZEN = []; });
  const shortName = n => String(n).replace(/^【冷凍】/, '').replace(/[（(][^）)]*[）)]/g, '').replace(/\s+/g, '');

  // 状態
  let last = null; try { last = JSON.parse(localStorage.getItem('kouju_ship_sender') || 'null'); } catch (e) {}
  const S = { step: 'count', cur: 0, dests: [newDest()], sender: { name:'', kana:'', tel:'', zip:'', addr:'', bldg:'', email:'', memo:'' }, addrMode: '' };
  function newDest(){ return { q: {}, name:'', kana:'', tel:'', zip:'', addr:'', bldg:'', date:'', time:'', note:'' }; }
  const itemsOf = d => (FROZEN || []).map((m, i) => d.q[i] ? shortName(m.name) + '×' + d.q[i] : '').filter(Boolean).join('、');
  const amtOf = d => (FROZEN || []).reduce((a, m, i) => a + (d.q[i] || 0) * Number(m.price || 0), 0);
  const STEPS = ['count', 'items', 'dest', 'sender', 'confirm'];

  function setProg(){ const k = STEPS.indexOf(S.step); document.querySelectorAll('#prog span').forEach((s, i) => s.classList.toggle('on', i <= k)); }
  const label = () => S.dests.length > 1 ? 'お届け先' + (NUM[S.cur] || S.cur + 1) + '（全' + S.dests.length + '件）' : '';

  function render(){
    setProg(); scrollTo(0, 0);
    const m = $('#main'), d = S.dests[S.cur];
    $('#bar').hidden = S.step === 'done';
    $('#back').hidden = S.step === 'count';
    $('#next').hidden = false;
    if (S.step === 'count') {
      $('#next').hidden = true;
      m.innerHTML = '<div class="q">送り先は何件ですか？</div><p class="qs">お届けする先の数を選んでください。</p>' +
        [1,2,3,4].map(n => '<button class="big cnt" data-n="' + n + '"><span class="ic">' + (NUM[n-1]) + '</span><span><b>' + n + '件</b><small>' + (n === 1 ? '1か所に送る' : n + 'か所に送る') + '</small></span></button>').join('') +
        '<div class="row" style="align-items:center"><input id="cntN" type="number" min="5" max="20" inputmode="numeric" placeholder="5件以上はこちらに数字"><button class="btn sub" id="cntGo" style="flex:0 0 90px;padding:12px">決定</button></div>';
      const go = n => { n = Math.max(1, Math.min(20, n | 0)); while (S.dests.length < n) S.dests.push(newDest()); S.dests.length = n; S.cur = 0; S.addrMode = ''; S.step = 'items'; render(); };
      m.querySelectorAll('.cnt').forEach(b => b.onclick = () => go(Number(b.dataset.n)));
      $('#cntGo').onclick = () => { const n = Number($('#cntN').value); if (n >= 1) go(n); };
    }
    else if (S.step === 'items') {
      $('#next').textContent = '次へ（送り先を入力）';
      m.innerHTML = (label() ? '<div class="who">' + label() + '</div>' : '') + '<div class="q">何を送りますか？</div><p class="qs">「＋」で数を選んでください。</p><div class="items" id="items"><p style="padding:12px">商品を読み込み中…</p></div>';
      menuP.then(() => {
        const box = $('#items'); if (!box) return;
        if (!FROZEN.length) { box.innerHTML = '<p style="padding:12px">商品一覧を読み込めませんでした。商品はレジでお伝えください。</p>'; return; }
        const G = [['迷ったらこれ！セット', /セット/], ['餃子', /餃子/], ['ワンタン', /ワンタン/], ['まんじゅう', /まん|花巻/], ['その他の点心', /./]];
        const grp = n => G.findIndex(g => g[1].test(n));
        const order = FROZEN.map((it, i) => i).sort((x, y) => grp(FROZEN[x].name) - grp(FROZEN[y].name) || x - y);
        let html = '', cg = -1;
        order.forEach(i => { const it = FROZEN[i], g = grp(it.name);
          if (g !== cg) { cg = g; html += '<div class="gh">' + G[g][0] + '</div>'; }
          html += '<div class="it' + (d.q[i] ? ' on' : '') + '" data-i="' + i + '"><div class="nm">' + esc(String(it.name).replace(/^【冷凍】/, '')) + '<small>' + yen(it.price) + '</small></div><button class="qb m" aria-label="減らす">−</button><span class="qty">' + (d.q[i] || 0) + '</span><button class="qb p" aria-label="増やす">＋</button></div>'; });
        box.innerHTML = html + '<div class="isum" id="isum"></div>';
        const upd = () => { const a = amtOf(d); $('#isum').textContent = a ? '商品代 ' + yen(a) + '（送料は別）' : '商品を選んでください'; };
        box.querySelectorAll('.it').forEach(row => {
          const i = Number(row.dataset.i);
          const set = v => { d.q[i] = Math.max(0, Math.min(99, v)); row.querySelector('.qty').textContent = d.q[i]; row.classList.toggle('on', d.q[i] > 0); upd(); };
          row.querySelector('.p').onclick = () => set((d.q[i] || 0) + 1);
          row.querySelector('.m').onclick = () => set((d.q[i] || 0) - 1);
        });
        upd();
      });
    }
    else if (S.step === 'dest') {
      $('#next').textContent = S.cur < S.dests.length - 1 ? '次へ（お届け先' + (NUM[S.cur + 1] || S.cur + 2) + 'へ）' : '次へ';
      const filled = d.name || d.tel || d.addr;
      if (!S.addrMode && !filled) {
        $('#next').hidden = true;
        m.innerHTML = (label() ? '<div class="who">' + label() + '</div>' : '') + '<div class="q">どなたに送りますか？</div><p class="qs">入れ方を選んでください。</p>' +
          '<button class="big" id="mContact"><span class="ic">📇</span><span><b>iPhoneの連絡先から選ぶ</b><small>名前・電話・住所がまとめて入ります</small></span></button>' +
          '<button class="big" id="mHand"><span class="ic">✍️</span><span><b>手で入力する</b><small>郵便番号を入れると住所が自動で入ります</small></span></button>' +
          (last && last.name ? '<button class="link" id="mSelf">自分（' + esc(last.name) + '様）の家に送る</button>' : '');
        $('#mContact').onclick = () => { S.addrMode = 'contact'; render(); };
        $('#mHand').onclick = () => { S.addrMode = 'hand'; render(); };
        if ($('#mSelf')) $('#mSelf').onclick = () => { Object.assign(d, { name: last.name || '', kana: last.kana || '', tel: last.tel || '', zip: last.zip || '', addr: last.addr || '', bldg: last.bldg || '' }); S.addrMode = 'hand'; render(); };
        return;
      }
      $('#next').hidden = false;
      if (S.addrMode === 'contact' && !filled) {
        $('#next').hidden = true;
        m.innerHTML = '<div class="q">iPhoneの連絡先から選ぶ</div>' +
          '<div class="howto"><b>① いったん「連絡先」アプリを開く</b><ol><li>送り先の人をタップ</li><li>下の方の「<b>連絡先を共有</b>」をタップ</li><li>「<b>"ファイル"に保存</b>」→ 右上の「保存」</li></ol></div>' +
          '<div class="howto"><b>② この画面に戻って、下のボタンを押す</b><ol><li>「<b>ファイルを選択</b>」をタップ</li><li>いま保存した連絡先をタップ</li></ol></div>' +
          '<button class="btn main" id="pick">📇 保存した連絡先を選ぶ</button><p class="msg" id="vmsg"></p>' +
          '<button class="link" id="toHand">うまくいかないときは、手で入力する</button>';
        $('#pick').onclick = () => { const f = $('#vcf'); f.value = ''; f.click(); };
        $('#toHand').onclick = () => { S.addrMode = 'hand'; render(); };
        return;
      }
      m.innerHTML = (label() ? '<div class="who">' + label() + '</div>' : '') + (filled ? '<div class="q">送り先を確認してください</div><p class="qs">間違いがあれば直してください。</p>' : '<div class="q">送り先を入力してください</div><p class="qs">郵便番号を入れると住所が自動で入ります。</p>') + addrForm('d', d) +
        '<details><summary>お届け日時・フリガナ・メモ（任意）</summary>' +
        '<label>お届け希望日</label><input type="date" id="d_date" value="' + esc(d.date) + '">' +
        '<label>時間帯</label><select id="d_time">' + Object.keys(TL).map(k => '<option value="' + k + '"' + (d.time === k ? ' selected' : '') + '>' + TL[k] + '</option>').join('') + '</select>' +
        '<label>フリガナ</label><input id="d_kana" value="' + esc(d.kana) + '">' +
        '<label>メモ（のし・ギフトなど）</label><input id="d_note" value="' + esc(d.note) + '"></details>' +
        '<button class="link" id="redo">入れ方を選び直す</button>';
      bindZip('d');
      $('#redo').onclick = () => { Object.assign(d, { name:'', kana:'', tel:'', zip:'', addr:'', bldg:'' }); S.addrMode = ''; render(); };
    }
    else if (S.step === 'sender') {
      $('#next').textContent = '次へ（確認）';
      const s = S.sender;
      m.innerHTML = '<div class="q">送り主（あなた）は？</div><p class="qs">送り状の「ご依頼主」になります。</p>' +
        (last && last.name && !s.name ? '<button class="big" id="useLast"><span class="ic">↩️</span><span><b>前回と同じ（' + esc(last.name) + '様）</b><small>タップで入ります</small></span></button>' : '') +
        addrForm('s', s) +
        '<details><summary>メールアドレス・フリガナ・備考（任意）</summary>' +
        '<label>メールアドレス</label><input type="email" id="s_email" inputmode="email" autocomplete="email" value="' + esc(s.email) + '"><p class="qs" style="margin:4px 0 0">書くと、ヤマトから配達予定メールと送り状番号が届きます。</p>' +
        '<label>フリガナ</label><input id="s_kana" value="' + esc(s.kana) + '">' +
        '<label>備考</label><input id="s_memo" value="' + esc(s.memo) + '"></details>';
      bindZip('s', true);
      if ($('#useLast')) $('#useLast').onclick = () => { Object.assign(s, last); render(); };
    }
    else if (S.step === 'confirm') {
      $('#next').textContent = 'この内容で受付する';
      const tot = S.dests.reduce((a, x) => a + amtOf(x), 0);
      m.innerHTML = '<div class="q">内容の確認</div>' +
        S.dests.map((x, i) => '<div class="card"><h3>お届け先' + (NUM[i] || i + 1) + '　' + esc(prefOf(x.addr)) + '<button class="link e" data-e="' + i + '">直す</button></h3>' +
          esc(x.name) + ' 様　' + esc(x.tel) + '<br>〒' + esc(x.zip) + ' ' + esc(x.addr) + ' ' + esc(x.bldg) +
          '<div style="margin-top:6px"><b>' + esc(itemsOf(x) || '（商品はレジで）') + '</b>' + (amtOf(x) ? '　' + yen(amtOf(x)) : '') + '</div>' +
          (x.date || x.time ? '<div class="qs" style="margin:4px 0 0">お届け：' + esc(x.date ? x.date.replace(/-/g, '/') : '指定なし') + '　' + TL[x.time || ''] + '</div>' : '') + '</div>').join('') +
        '<button class="btn sub" id="more" style="margin:4px 0 14px">＋ 別の人にも送る</button>' +
        '<div class="card"><h3>送り主（あなた）<button class="link e" id="es">直す</button></h3>' + esc(S.sender.name) + ' 様　' + esc(S.sender.tel) + '<br>〒' + esc(S.sender.zip) + ' ' + esc(S.sender.addr) + ' ' + esc(S.sender.bldg) + '</div>' +
        (tot ? '<div class="tot">商品代合計 ' + yen(tot) + '<br><span style="font-size:13px;font-weight:400">＋ 送料はレジでご案内します</span></div>' : '');
      m.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { S.cur = Number(b.dataset.e); S.step = 'dest'; S.addrMode = 'hand'; render(); });
      $('#es').onclick = () => { S.step = 'sender'; render(); };
      $('#more').onclick = () => { S.dests.push(newDest()); S.cur = S.dests.length - 1; S.addrMode = ''; S.step = 'items'; render(); };
    }
  }

  function addrForm(p, o){
    return '<label>お名前</label><input id="' + p + '_name" autocomplete="' + (p === 's' ? 'name' : 'off') + '" value="' + esc(o.name) + '">' +
      '<label>電話番号</label><input id="' + p + '_tel" type="tel" inputmode="tel" autocomplete="' + (p === 's' ? 'tel' : 'off') + '" value="' + esc(o.tel) + '">' +
      '<label>郵便番号 <span id="' + p + '_zmsg" style="font-weight:400"></span></label><input id="' + p + '_zip" inputmode="numeric" autocomplete="' + (p === 's' ? 'postal-code' : 'off') + '" placeholder="例 232-0053" value="' + esc(o.zip) + '">' +
      '<label>住所（番地まで）</label><input id="' + p + '_addr" autocomplete="' + (p === 's' ? 'street-address' : 'off') + '" value="' + esc(o.addr) + '">' +
      '<label>建物名・部屋番号</label><input id="' + p + '_bldg" value="' + esc(o.bldg) + '">';
  }
  function bindZip(p){
    const zi = $('#' + p + '_zip'), ad = $('#' + p + '_addr'), msg = $('#' + p + '_zmsg');
    zi.addEventListener('input', async () => {
      const dd = z2h(zi.value).replace(/\D/g, '');
      if (dd.length !== 7) { msg.textContent = ''; return; }
      const r = await zipLookup(dd);
      if (!r) { msg.textContent = '（見つかりません）'; return; }
      const a = PREF[r[0]] + (r[1] || '') + (r[2] || '') + (r[3] || '');
      if (!ad.value || ad.dataset.auto === '1') { ad.value = a; ad.dataset.auto = '1'; }
      msg.textContent = '✓ 住所を入れました。番地を続けて入力';
      ad.focus(); ad.setSelectionRange(ad.value.length, ad.value.length);
    });
    ad.addEventListener('input', () => { ad.dataset.auto = ''; });
  }
  function collect(p, o){
    ['name','tel','zip','addr','bldg','kana','email','memo','date','time','note'].forEach(k => { const el = $('#' + p + '_' + k); if (el) o[k] = (el.value || '').trim(); });
    if (o.zip) o.zip = zipNorm(o.zip); if (o.tel) o.tel = telNorm(o.tel);
  }
  function check(o){
    const miss = [];
    if (!o.name) miss.push('お名前'); if (!/^\d[\d-]{8,13}$/.test(o.tel || '')) miss.push('電話番号');
    if (!/^\d{3}-\d{4}$/.test(o.zip || '')) miss.push('郵便番号'); if (!o.addr) miss.push('住所');
    if (o.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(o.email)) miss.push('メールアドレス');
    return miss;
  }

  $('#vcf').onchange = async () => {
    const f = $('#vcf').files && $('#vcf').files[0]; if (!f) return;
    const c = parseVcard(await f.text());
    if (!c) { $('#vmsg').textContent = '連絡先を読み取れませんでした。「手で入力する」でお願いします。'; return; }
    Object.assign(S.dests[S.cur], { name: c.name || '', kana: c.kana || '', tel: c.tel || '', zip: c.zip || '', addr: c.addr || '', bldg: c.bldg || '' });
    S.addrMode = 'hand'; render();
  };

  $('#back').onclick = () => {
    if (S.step === 'items') { if (S.cur > 0) { S.cur--; S.step = 'dest'; S.addrMode = 'hand'; } else S.step = 'count'; }
    else if (S.step === 'dest') { collect('d', S.dests[S.cur]); if (S.addrMode && !(S.dests[S.cur].name || S.dests[S.cur].addr)) S.addrMode = ''; else S.step = 'items'; }
    else if (S.step === 'sender') { collect('s', S.sender); S.step = 'dest'; S.addrMode = 'hand'; }
    else if (S.step === 'confirm') { S.step = 'sender'; }
    render();
  };

  $('#next').onclick = async () => {
    if (S.step === 'items') {
      if (FROZEN && FROZEN.length && !amtOf(S.dests[S.cur])) { alertBox('送る商品を「＋」で選んでください。'); return; }
      S.step = 'dest'; render();
    } else if (S.step === 'dest') {
      const d = S.dests[S.cur]; collect('d', d);
      const miss = check(d); if (miss.length) { alertBox('次の項目を確認してください\n・' + miss.join('\n・')); return; }
      if (S.cur < S.dests.length - 1 && !(S.dests[S.cur + 1].name)) { S.cur++; S.addrMode = ''; S.step = 'items'; } else S.step = S.sender.name ? 'confirm' : 'sender'; render();
    } else if (S.step === 'sender') {
      collect('s', S.sender);
      const miss = check(S.sender); if (miss.length) { alertBox('次の項目を確認してください\n・' + miss.join('\n・')); return; }
      S.step = 'confirm'; render();
    } else if (S.step === 'confirm') {
      const b = $('#next'); b.disabled = true; b.textContent = '送信中…';
      const s = S.sender;
      const payload = { action: 'ship', rid: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), sender: { name: s.name, kana: s.kana, tel: s.tel, zip: s.zip, addr: s.addr, bldg: s.bldg, email: s.email, memo: s.memo },
        dests: S.dests.map(x => ({ name: x.name, kana: x.kana, tel: x.tel, zip: x.zip, addr: x.addr, bldg: x.bldg, item: itemsOf(x), amt: String(amtOf(x) || ''), date: x.date, time: x.time, note: x.note })) };
      try {
        const r = await fetch(API, { method: 'POST', body: JSON.stringify(payload), credentials: 'omit' }).then(r => r.json());
        if (!r.ok) throw new Error(r.error || '送信できませんでした');
        try { localStorage.setItem('kouju_ship_sender', JSON.stringify({ name: s.name, kana: s.kana, tel: s.tel, zip: s.zip, addr: s.addr, bldg: s.bldg, email: s.email })); } catch (e) {}
        const tot = S.dests.reduce((a, x) => a + amtOf(x), 0);
        S.step = 'done'; setProg(); $('#bar').hidden = true; scrollTo(0, 0);
        $('#main').innerHTML = '<div class="done"><div class="q">受付できました</div><div class="no">No.' + esc(r.data.no) + '</div><p>この画面を<b>レジでスタッフに</b>お見せください。<br>商品代＋送料のお会計をお願いします。</p></div>' +
          '<div class="card">' + esc(s.name) + ' 様<br>' + S.dests.map((x, i) => '<div style="border-top:1px solid #eadcc7;padding:8px 0;margin-top:6px"><b style="font-size:18px">' + (NUM[i] || i + 1) + ' ' + esc(prefOf(x.addr) || '（県不明）') + '</b>　' + (amtOf(x) ? '<b>' + yen(amtOf(x)) + '</b>' : '') + '<br>' + esc(itemsOf(x) || '商品はレジで') + '</div>').join('') +
          (tot ? '<div class="tot">商品代合計 ' + yen(tot) + '<br><span style="font-size:13px;font-weight:400">＋ 送料（お届け先の県ごと）</span></div>' : '') + '</div>';
      } catch (e) {
        alertBox('送信できませんでした。もう一度お試しいただくか、スタッフにお声がけください。\n（' + e.message + '）');
        b.textContent = 'この内容で受付する';
      } finally { b.disabled = false; }
    }
  };

  function alertBox(msg){
    let m = $('#msgbox');
    if (!m) { m = document.createElement('div'); m.id = 'msgbox'; m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9';
      m.innerHTML = '<div style="background:#fff;border-radius:14px;padding:18px;max-width:420px;width:100%"><p style="white-space:pre-wrap;margin:0 0 14px"></p><button class="btn main">OK</button></div>';
      m.querySelector('button').onclick = () => m.hidden = true; document.body.appendChild(m); }
    m.querySelector('p').textContent = msg; m.hidden = false;
  }
  render();
})();
</script>
</body>
</html>

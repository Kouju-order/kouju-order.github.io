<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冷凍品の発送受付｜公珠</title>
<meta name="robots" content="noindex">
<style>
:root{--red:#b5262b;--ink:#2a1a14;--sub:#6b5548;--bg:#fffaf0;--line:#e7d6bf;--ok:#2e7d32}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.55}
header{background:var(--red);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:19px}
header p{margin:4px 0 0;font-size:13px;opacity:.9}
main{max-width:560px;margin:0 auto;padding:14px 14px 120px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
.card h2{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
.card h2 .n{color:var(--red);font-size:20px;margin-left:2px}
label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:10px 0 4px}
label .req{color:var(--red);font-size:11px;margin-left:4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid #d9c6ad;border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.zip{display:flex;gap:8px;align-items:center}
.zip input{flex:0 0 150px}
.zip small{color:var(--sub);font-size:12px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.btn.main{background:var(--red);color:#fff}
.btn.sub{background:#fff;color:var(--red);border:1.5px solid var(--red);font-size:15px;padding:11px}
.btn.ghost{background:#f4ebdd;color:var(--ink);font-size:14px;padding:10px;font-weight:700}
.tools{display:flex;gap:8px;margin:0 0 6px;flex-wrap:wrap}
.tools .btn{flex:1;min-width:140px}
.hint{font-size:12.5px;color:var(--sub);margin:6px 0 0}
.del{float:right;background:none;border:0;color:var(--sub);font-size:13px;text-decoration:underline;cursor:pointer}
.paste{margin-top:8px;display:none}
.paste.on{display:block}
.err{color:var(--red);font-size:13px;margin-top:4px;display:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,250,240,.96);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.bar .btn{max-width:560px;margin:0 auto}
.sum dl{margin:0;display:grid;grid-template-columns:7.5em 1fr;gap:4px 8px;font-size:14px}
.sum dt{color:var(--sub)}
.sum dd{margin:0;word-break:break-all}
.done{text-align:center;padding:26px 14px}
.done .no{font-size:30px;font-weight:900;color:var(--red);letter-spacing:1px;margin:8px 0}
.note{background:#fff3e0;border:1px solid #f0d2a6;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:0 0 14px}
[hidden]{display:none!important}
</style>
</head>
<body data-api="https://script.google.com/macros/s/AKfycbwa-2vEjFBCXPFlnAeDj183ezOX0XGquyYTlFIgafLjcIAuQXsEXa7PYhIan-4oa4ildg/exec">
<header>
  <h1>🧊 冷凍品の発送受付</h1>
  <p>中華料理 公珠｜ご入力後、レジでお会計（商品代＋送料）をお願いします</p>
</header>
<main>
<div id="form">
  <div class="note">ヤマト運輸のクール便（冷凍）でお送りします。住所は郵便番号を入れると自動で入ります。</div>

  <section class="card" id="sender">
    <h2>ご依頼主（あなた）</h2>
    <button type="button" class="btn ghost" id="useLast" hidden>前回入力した内容を使う</button>
    <label>お名前<span class="req">必須</span></label>
    <input name="name" autocomplete="name" placeholder="公珠 太郎">
    <label>フリガナ</label>
    <input name="kana" placeholder="コウジュ タロウ">
    <label>電話番号<span class="req">必須</span></label>
    <input name="tel" type="tel" autocomplete="tel" inputmode="tel" placeholder="090-1234-5678">
    <label>郵便番号<span class="req">必須</span></label>
    <div class="zip"><input name="zip" autocomplete="postal-code" inputmode="numeric" placeholder="232-0053"><small class="zmsg"></small></div>
    <label>住所<span class="req">必須</span></label>
    <input name="addr" autocomplete="street-address" placeholder="神奈川県横浜市南区井土ケ谷下町37-6">
    <label>建物名・部屋番号</label>
    <input name="bldg" autocomplete="address-line2" placeholder="〇〇マンション 101">
    <label>メールアドレス（送り状番号が必要な方）</label>
    <input name="email" type="email" autocomplete="email" inputmode="email" placeholder="example@mail.com">
    <p class="hint">ご記入いただくと、ヤマト運輸から配達予定メールと一緒に送り状番号が届きます。</p>
    <label>備考</label>
    <input name="memo" placeholder="">
  </section>

  <div id="dests"></div>
  <button type="button" class="btn sub" id="addDest">＋ お届け先をもう1件追加</button>
</div>

<div id="confirm" hidden>
  <section class="card sum" id="sumBox"></section>
  <button type="button" class="btn sub" id="back">← 修正する</button>
</div>

<div id="done" class="card done" hidden>
  <div>受付が完了しました</div>
  <div class="no" id="doneNo"></div>
  <div>この画面を<b>レジでスタッフに</b>お見せください。<br>お会計（商品代＋送料）をお願いします。</div>
  <p class="hint" id="doneSum"></p>
  <button type="button" class="btn sub" id="again" style="margin-top:16px">続けて別の受付をする</button>
</div>
</main>
<div class="bar" id="bar"><button type="button" class="btn main" id="next">入力内容を確認する</button></div>

<template id="destT">
  <section class="card dest">
    <h2>お届け先<span class="n"></span> <button type="button" class="del">削除</button></h2>
    <div class="tools">
      <button type="button" class="btn ghost pick" hidden>📒 電話帳から選ぶ</button>
      <button type="button" class="btn ghost same">自分あてに送る</button>
      <button type="button" class="btn ghost pst">📋 住所を貼り付け</button>
    </div>
    <div class="paste"><textarea rows="4" placeholder="ここを長押しして「ペースト」してください（名前・〒・住所・電話番号がまとめて入っていてもOK）"></textarea><p class="hint pmsg" style="color:var(--red);font-weight:700"></p><button type="button" class="btn ghost doPaste" style="margin-top:6px">もう一度読み取る</button></div>
    <label>お名前<span class="req">必須</span></label>
    <input name="name" placeholder="山田 花子">
    <label>フリガナ</label>
    <input name="kana" placeholder="ヤマダ ハナコ">
    <label>電話番号<span class="req">必須</span></label>
    <input name="tel" type="tel" inputmode="tel" placeholder="045-000-0000">
    <label>郵便番号<span class="req">必須</span></label>
    <div class="zip"><input name="zip" inputmode="numeric" placeholder="000-0000"><small class="zmsg"></small></div>
    <label>住所<span class="req">必須</span></label>
    <input name="addr" placeholder="都道府県から番地まで">
    <label>建物名・部屋番号</label>
    <input name="bldg" placeholder="〇〇マンション 101">
    <label>お送りする品物</label>
    <input name="item" placeholder="例：金餃子20個入×2、焼売">
    <div class="row">
      <div><label>お届け希望日</label><input name="date" type="date"></div>
      <div><label>時間帯</label><select name="time">
        <option value="">指定なし</option><option value="0812">午前中</option><option value="1416">14〜16時</option>
        <option value="1618">16〜18時</option><option value="1820">18〜20時</option><option value="1921">19〜21時</option>
      </select></div>
    </div>
    <p class="hint">お届け日は発送日の翌日以降（地域により翌々日以降）になります。</p>
    <label>メモ（ギフト・のし など）</label>
    <input name="note" placeholder="">
  </section>
</template>

<script>
(function(){
  const API = document.body.dataset.api;
  const $ = s => document.querySelector(s);
  const PREF = ['','北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];
  const z2h = s => String(s || '').replace(/[０-９－ー‐−]/g, c => ({'－':'-','ー':'-','‐':'-','−':'-'}[c] || String.fromCharCode(c.charCodeAt(0) - 0xFEE0)));
  const zipNorm = s => { const d = z2h(s).replace(/\D/g, ''); return d.length === 7 ? d.slice(0,3) + '-' + d.slice(3) : z2h(s).trim(); };

  // 郵便番号 → 住所（yubinbango のデータを利用）
  const zcache = {};
  function zipLookup(zip7){
    const k = zip7.slice(0,3);
    if (zcache[k]) return Promise.resolve(zcache[k][zip7]);
    return new Promise(res => {
      window.$yubin = data => { zcache[k] = data; res(data[zip7]); };
      const sc = document.createElement('script');
      sc.src = 'https://yubinbango.github.io/yubinbango-data/data/' + k + '.js';
      sc.onerror = () => res(null);
      document.head.appendChild(sc); setTimeout(() => sc.remove(), 5000);
    });
  }
  function bindZip(box){
    const zi = box.querySelector('[name=zip]'), ad = box.querySelector('[name=addr]'), msg = box.querySelector('.zmsg');
    zi.addEventListener('input', async () => {
      const d = z2h(zi.value).replace(/\D/g,'');
      if (d.length !== 7) { msg.textContent = ''; return; }
      msg.textContent = '検索中…';
      const r = await zipLookup(d);
      if (!r) { msg.textContent = '見つかりません。住所を入力してください'; return; }
      const a = PREF[r[0]] + (r[1]||'') + (r[2]||'') + (r[3]||'');
      if (!ad.value || ad.dataset.auto === '1') { ad.value = a; ad.dataset.auto = '1'; }
      msg.textContent = '✓ 住所を入れました（番地を続けて入力）';
      ad.focus(); ad.setSelectionRange(ad.value.length, ad.value.length);
    });
    ad.addEventListener('input', () => { ad.dataset.auto = ''; });
  }
  bindZip($('#sender'));

  const val = (box, n) => (box.querySelector('[name=' + n + ']').value || '').trim();
  const setv = (box, n, v) => { const el = box.querySelector('[name=' + n + ']'); el.value = v || ''; };
  const F = ['name','kana','tel','zip','addr','bldg'];
  const FS = F.concat(['email']);
  const read = box => { const o = {}; box.querySelectorAll('[name]').forEach(el => o[el.name] = (el.value || '').trim()); if (o.zip) o.zip = zipNorm(o.zip); if (o.tel) o.tel = z2h(o.tel).replace(/[^\d-]/g,''); return o; };

  // 前回の依頼主情報（この端末だけに保存）
  let last = null; try { last = JSON.parse(localStorage.getItem('kouju_ship_sender') || 'null'); } catch(e) {}
  if (last && last.name) { const b = $('#useLast'); b.hidden = false; b.textContent = '前回の内容を使う（' + last.name + '様）'; b.onclick = () => { FS.forEach(k => setv($('#sender'), k, last[k])); b.hidden = true; }; }

  // 住所のテキストを貼り付けて分解
  function parsePaste(t){
    t = z2h(String(t || '')).replace(/\r/g, '').replace(/[‐‑–—―ｰ]/g, '-').replace(/ /g, ' ');
    const o = {};
    // 電話番号（どこにあってもOK）
    const telRe = /(\+81[\s-]?\(?0?\d{1,4}\)?|\(?0\d{1,4}\)?)[\s-]?\d{1,4}[\s-]?\d{3,4}/g;
    let m;
    while ((m = telRe.exec(t))) {
      let v = m[0].replace(/^\+81[\s-]?\(?0?/, '0').replace(/[()]/g, '-').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
      const d = v.replace(/\D/g, '');
      const before = t.slice(Math.max(0, m.index - 1), m.index);
      if ((d.length === 10 || d.length === 11) && !/〒/.test(t.slice(Math.max(0, m.index - 2), m.index)) && !/[\d-]/.test(before)) {
        if (!/-/.test(v)) v = d.length === 11 ? d.slice(0,3) + '-' + d.slice(3,7) + '-' + d.slice(7) : d;
        o.tel = v; t = t.slice(0, m.index) + '\n' + t.slice(m.index + m[0].length); break;
      }
    }
    // 郵便番号
    const zm = t.match(/〒\s*(\d{3})-?(\d{4})/) || t.match(/(?:^|[^\d-])(\d{3})-(\d{4})(?![\d-])/) || t.match(/(?:^|[^\d-])(\d{7})(?![\d-])/);
    if (zm) {
      o.zip = zm[2] ? zm[1] + '-' + zm[2] : zm[1].slice(0,3) + '-' + zm[1].slice(3);
      t = t.replace(zm[0], zm[0].match(/^[^\d〒]/) ? zm[0][0] + '\n' : '\n');
    }
    const LABEL = /^(住所|電話番号?|TEL|自宅|携帯|勤務先|会社|ホーム|職場|その他|名前|氏名|メイン|iPhone|モバイル)\s*[:：]?\s*/i;
    const lines = t.split(/[\n,，、]+/).map(l => l.replace(LABEL, '').replace(/^〒/, '').trim()).filter(l => l && !/^(日本|japan)$/i.test(l));
    const isPref = l => PREF.some(p => p && l.startsWith(p));
    const prefAt = l => { let k = -1; PREF.forEach(p => { if (!p) return; const x = l.indexOf(p); if (x >= 0 && (k < 0 || x < k)) k = x; }); return k; };
    const isCity = l => /^[^\d]*[市区町村郡]$/.test(l) || (/[市区町村郡]/.test(l) && !/\d/.test(l));
    const isAddr = l => prefAt(l) >= 0 || /[市区町村郡]/.test(l) || /\d+(丁目|番地?|号)/.test(l) || /\d+-\d+/.test(l);
    const addr = [], rest = [];
    lines.forEach(l => {
      const k = prefAt(l);
      if (k > 0) { const head = l.slice(0, k).trim(); if (head) rest.push(head); addr.push(l.slice(k).trim()); }
      else if (isAddr(l)) addr.push(l);
      else rest.push(l);
    });
    if (addr.length) {
      const rank = l => isPref(l) ? 0 : isCity(l) ? 1 : 2;
      o.addr = addr.map((l, k) => [rank(l), k, l]).sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(x => x[2]).join('').replace(/\s+/g, '');
      if (o.addr.length > 0 && !isPref(o.addr) && o.zip) o.needPref = true;
    }
    const nm = rest.find(l => l.length <= 20 && !/\d/.test(l) && !/@/.test(l) && !/^(様|さん)$/.test(l));
    if (nm) o.name = nm.replace(/\s*(様|さん)$/, '');
    return o;
  }

  const canPick = 'contacts' in navigator && 'select' in (navigator.contacts || {});
  let n = 0;
  function addDest(){
    const node = $('#destT').content.firstElementChild.cloneNode(true);
    $('#dests').appendChild(node);
    bindZip(node);
    node.querySelector('.del').onclick = () => { node.remove(); renum(); };
    node.querySelector('.same').onclick = () => { const s = read($('#sender')); F.forEach(k => setv(node, k, s[k])); };
    const pst = node.querySelector('.paste');
    const ta = pst.querySelector('textarea'), pmsg = pst.querySelector('.pmsg');
    const apply = async txt => {
      const o = parsePaste(txt);
      const got = [];
      if (o.name) { setv(node, 'name', o.name); got.push('お名前'); }
      if (o.tel) { setv(node, 'tel', o.tel); got.push('電話'); }
      if (o.zip) { setv(node, 'zip', o.zip); got.push('〒'); }
      if (o.addr) {
        let a = o.addr;
        if (o.needPref && o.zip) { const r = await zipLookup(o.zip.replace('-', '')); if (r && !a.startsWith(PREF[r[0]])) { const town = r[2] || '', k = town ? a.indexOf(town) : -1; a = k >= 0 ? PREF[r[0]] + (r[1] || '') + a.slice(k) : PREF[r[0]] + a; } }
        const ad = node.querySelector('[name=addr]'); ad.value = a; ad.dataset.auto = ''; got.push('住所');
      }
      pmsg.textContent = got.length ? '✓ ' + got.join('・') + 'を入れました。下で確認してください' : '読み取れませんでした。お手数ですが下の欄に直接入力してください';
      return got.length;
    };
    node.querySelector('.pst').onclick = async () => {
      let txt = '';
      try { if (navigator.clipboard && navigator.clipboard.readText) txt = await navigator.clipboard.readText(); } catch (e) {}
      pst.classList.add('on');
      if (txt && txt.trim()) { ta.value = txt; await apply(txt); }
      else { pmsg.textContent = ''; ta.focus(); }
    };
    ta.addEventListener('paste', () => setTimeout(() => apply(ta.value), 50));
    node.querySelector('.doPaste').onclick = () => apply(ta.value);
    if (canPick) {
      const pk = node.querySelector('.pick'); pk.hidden = false;
      pk.onclick = async () => {
        try {
          const props = await navigator.contacts.getProperties();
          const want = ['name','tel','address'].filter(p => props.includes(p));
          const [c] = await navigator.contacts.select(want, { multiple: false });
          if (!c) return;
          if (c.name && c.name[0]) setv(node, 'name', c.name[0]);
          if (c.tel && c.tel[0]) setv(node, 'tel', z2h(c.tel[0]).replace(/^\+81/, '0').replace(/[^\d-]/g,''));
          const a = c.address && c.address[0];
          if (a) {
            if (a.postalCode) setv(node, 'zip', zipNorm(a.postalCode));
            const line = [a.region, a.city, ...(a.addressLine || [])].filter(Boolean).join('');
            if (line) setv(node, 'addr', line.replace(/^日本/, ''));
          }
        } catch (e) {}
      };
    }
    renum();
    return node;
  }
  function renum(){ document.querySelectorAll('.dest').forEach((d, i, all) => { d.querySelector('.n').textContent = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳'[i] || String(i + 1); d.querySelector('.del').hidden = all.length < 2; }); }
  addDest();
  $('#addDest').onclick = () => { const d = addDest(); d.scrollIntoView({ behavior: 'smooth' }); };

  function check(box, title){
    const o = read(box), miss = [];
    if (!o.name) miss.push('お名前'); if (!/^\d[\d-]{8,13}$/.test(o.tel || '')) miss.push('電話番号');
    if (!/^\d{3}-\d{4}$/.test(o.zip || '')) miss.push('郵便番号'); if (!o.addr) miss.push('住所');
    if (o.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(o.email)) miss.push('メールアドレス');
    return miss.length ? title + '：' + miss.join('・') : '';
  }
  const TL = { '':'指定なし','0812':'午前中','1416':'14〜16時','1618':'16〜18時','1820':'18〜20時','1921':'19〜21時' };
  const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let payload = null, step = 'form';

  $('#next').onclick = async () => {
    if (step === 'form') {
      const errs = [check($('#sender'), 'ご依頼主')];
      document.querySelectorAll('.dest').forEach((d, i) => errs.push(check(d, 'お届け先' + ('①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳'[i] || (i + 1)))));
      const e = errs.filter(Boolean);
      if (e.length) { alertBox('次の項目を確認してください\n' + e.join('\n')); return; }
      const sender = read($('#sender'));
      const dests = [...document.querySelectorAll('.dest')].map(read);
      payload = { action: 'ship', sender, dests, rid: Date.now().toString(36) + Math.random().toString(36).slice(2,8) };
      $('#sumBox').innerHTML = '<h2>ご依頼主</h2><dl>' + row('お名前', sender.name + ' 様') + row('電話', sender.tel) + row('住所', '〒' + sender.zip + ' ' + sender.addr + ' ' + sender.bldg) + (sender.email ? row('メール', sender.email) : '') + (sender.memo ? row('備考', sender.memo) : '') + '</dl>' +
        dests.map((d, i) => '<h2 style="margin-top:14px">お届け先' + ('①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳'[i] || (i + 1)) + '</h2><dl>' + row('お名前', d.name + ' 様') + row('電話', d.tel) + row('住所', '〒' + d.zip + ' ' + d.addr + ' ' + d.bldg) +
          row('品物', d.item || '（レジでご相談）') + row('お届け日時', (d.date ? d.date.replace(/-/g,'/') : '指定なし') + '　' + TL[d.time || '']) + (d.note ? row('メモ', d.note) : '') + '</dl>').join('');
      $('#form').hidden = true; $('#confirm').hidden = false; $('#next').textContent = 'この内容で受付する'; step = 'confirm'; scrollTo(0, 0);
    } else if (step === 'confirm') {
      const b = $('#next'); b.disabled = true; b.textContent = '送信中…';
      try {
        const r = await fetch(API, { method: 'POST', body: JSON.stringify(payload), credentials: 'omit' }).then(r => r.json());
        if (!r.ok) throw new Error(r.error || '送信できませんでした');
        try { const s = payload.sender; localStorage.setItem('kouju_ship_sender', JSON.stringify({ name: s.name, kana: s.kana, tel: s.tel, zip: s.zip, addr: s.addr, bldg: s.bldg, email: s.email })); } catch(e) {}
        $('#doneNo').textContent = '受付 No.' + r.data.no;
        $('#doneSum').textContent = payload.sender.name + '様　お届け先 ' + payload.dests.length + '件';
        $('#confirm').hidden = true; $('#done').hidden = false; $('#bar').hidden = true; step = 'done'; scrollTo(0, 0);
      } catch (e) {
        alertBox('送信できませんでした。電波の良いところでもう一度お試しいただくか、スタッフにお声がけください。\n（' + e.message + '）');
        b.textContent = 'この内容で受付する';
      } finally { b.disabled = false; }
    }
  };
  function row(k, v){ return '<dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd>'; }
  $('#back').onclick = () => { $('#form').hidden = false; $('#confirm').hidden = true; $('#next').textContent = '入力内容を確認する'; step = 'form'; };
  $('#again').onclick = () => location.reload();

  function alertBox(msg){
    let m = $('#msgbox');
    if (!m) { m = document.createElement('div'); m.id = 'msgbox'; m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9';
      m.innerHTML = '<div style="background:#fff;border-radius:14px;padding:18px;max-width:420px;width:100%"><p style="white-space:pre-wrap;margin:0 0 14px"></p><button class="btn main">OK</button></div>';
      m.querySelector('button').onclick = () => m.hidden = true; document.body.appendChild(m); }
    m.querySelector('p').textContent = msg; m.hidden = false;
  }
})();
</script>
</body>
</html>

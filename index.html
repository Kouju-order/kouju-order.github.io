<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<title>公珠 モバイルオーダー</title>
<style>
  :root { --red:#a8231b; --ink:#231f1c; --muted:#7a716a; --bg:#f8f4ee; --card:#fff; --line:#e7dfd4; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--ink); padding-bottom:110px; }
  header { background:var(--red); color:#fff; padding:16px 16px 14px; }
  header h1 { margin:0; font-size:21px; letter-spacing:.05em; }
  html[lang^="zh-Hans"] body { font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif; }
  html[lang^="zh-Hant"] body { font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; }
  .langs { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .langs button { border:1px solid rgba(255,255,255,.7); background:transparent; color:#fff; border-radius:999px; padding:5px 11px; font-size:13px; font-weight:700; }
  .langs button.on { background:#fff; color:var(--red); border-color:#fff; }
  header .tbl { margin-top:4px; font-size:14px; opacity:.92; }
  main { padding:4px 16px; }
  .tabs { position:sticky; top:0; z-index:5; display:grid; grid-template-rows:repeat(2, auto); grid-auto-flow:column; grid-auto-columns:max-content; gap:6px 8px; overflow-x:auto; padding:10px 16px; background:var(--bg); border-bottom:1px solid var(--line); -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tabs[hidden] { display:none; }
  .tabs button { flex:0 0 auto; border:1.5px solid var(--red); background:#fff; color:var(--red); border-radius:999px; padding:6px 12px; font-size:14px; font-weight:700; white-space:nowrap; }
  .tabs button.on { background:var(--red); color:#fff; }
  .group { scroll-margin-top:64px; }
  .ghd { display:flex; align-items:center; gap:10px; margin:26px 0 6px; background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; min-height:104px; }
  .ghd .tx { flex:1; min-width:0; padding:12px 0 12px 16px; }
  h3.grp { font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-size:22px; line-height:1.25; margin:0; color:var(--ink); display:inline-block; border-bottom:2px solid #b08a4a; padding-bottom:3px; }
  .ghd .sub { display:block; font-size:11px; letter-spacing:.12em; color:#b08a4a; margin-top:6px; }
  .ghd img { width:124px; height:104px; object-fit:cover; flex:0 0 auto; -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 32%); mask-image:linear-gradient(90deg,transparent 0,#000 32%); }
  h2 { font-size:15px; color:var(--red); margin:22px 0 8px; padding-bottom:6px; border-bottom:2px solid var(--line); }
  .item { display:flex; align-items:center; gap:12px; background:var(--card); border-radius:12px; padding:14px; margin-bottom:8px; }
  .item .info { flex:1; min-width:0; }
  .item .thumb { width:64px; height:64px; border-radius:10px; object-fit:cover; flex:0 0 auto; }
  .item .name { font-size:16px; font-weight:600; }
  .item .ja { font-size:12px; color:var(--muted); margin-top:2px; }
  .item .ja:empty { display:none; }
  .item .price { font-size:14px; color:var(--muted); margin-top:2px; }
  .item .price s { color:#9a9088; }
  .item .price .dealp { color:#c0281c; font-size:17px; }
  .row .ja { display:block; font-size:12px; color:var(--muted); }
  .step { display:flex; align-items:center; gap:8px; }
  .step button { width:38px; height:38px; border-radius:50%; border:1.5px solid var(--red); background:#fff; color:var(--red); font-size:22px; line-height:1; }
  .step button.plus { background:var(--red); color:#fff; }
  .step .q { min-width:20px; text-align:center; font-size:17px; font-weight:700; }
  .step button.minus[hidden], .step .q[hidden] { display:none; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:#fff; border-top:1px solid var(--line); }
  .btn { width:100%; border:0; border-radius:12px; background:var(--red); color:#fff; font-size:17px; font-weight:700; padding:15px; }
  .btn:disabled { background:#c9bfb5; }
  .btn.sub { background:#fff; color:var(--red); border:1.5px solid var(--red); margin-top:10px; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; z-index:10; }
  .overlay[hidden] { display:none; }
.tblq { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
.tblq button { font-size:20px; font-weight:700; padding:12px 0; border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); }
  .sheet { background:var(--bg); width:100%; max-height:88vh; overflow:auto; border-radius:18px 18px 0 0; padding:20px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin:0 0 12px; font-size:18px; }
  .row { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .total { display:flex; justify-content:space-between; font-size:18px; font-weight:700; margin:14px 0; }
  textarea, input { width:100%; font-size:16px; padding:10px; border:1px solid var(--line); border-radius:10px; font-family:inherit; }
  .center { text-align:center; padding:40px 8px; }
  .big { font-size:44px; font-weight:800; color:var(--red); margin:8px 0; }
  .muted { color:var(--muted); font-size:14px; }
  .deal { margin:-2px 0 10px; padding:8px 12px; background:#fff4d6; border:1.5px solid #e2a400; border-radius:10px; color:#8a3b00; font-weight:800; font-size:15px; }
  .ask { font-size:15px; font-weight:700; margin:4px 0 2px; }
</style>
</head>
<body data-api="https://script.google.com/macros/s/AKfycbwa-2vEjFBCXPFlnAeDj183ezOX0XGquyYTlFIgafLjcIAuQXsEXa7PYhIan-4oa4ildg/exec">
<header>
  <h1 data-t="title">公珠 モバイルオーダー</h1>
  <div class="tbl" id="tblLabel"></div>
  <div class="langs" id="langs"></div>
</header>
<nav class="tabs" id="tabs" hidden></nav>
<main id="menu"><p class="muted center" data-t="loading">メニューを読み込み中…</p></main>

<button id="histBtn" hidden style="position:fixed;right:12px;bottom:88px;z-index:5;border:0;border-radius:999px;padding:10px 16px;font-size:15px;font-weight:700;background:#fff;color:#a8261b;box-shadow:0 3px 10px rgba(0,0,0,.25)"></button>
<div class="overlay" id="askGlass" hidden>
  <div class="sheet center">
    <h3 id="glTitle"></h3>
    <div style="display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0">
      <button type="button" id="glMinus" style="width:52px;height:52px;border-radius:50%;border:1px solid #ccc;background:#fff;font-size:26px">−</button>
      <span id="glNum" style="font-size:30px;font-weight:700;min-width:70px"></span>
      <button type="button" id="glPlus" style="width:52px;height:52px;border-radius:50%;border:1px solid #ccc;background:#fff;font-size:26px">＋</button>
    </div>
    <button class="btn" id="glOk"></button>
    <button class="btn sub" id="glNone" style="margin-top:8px"></button>
  </div>
</div>
<div class="overlay" id="rsvSheet" hidden>
  <div class="sheet">
    <h3 id="rsvTitle"></h3>
    <div id="rsvForm"></div>
    <p id="rsvMsg" style="color:#c0281c;font-weight:700;margin:8px 0 0"></p>
    <button class="btn" id="rsvSend"></button>
    <button class="btn sub" id="rsvClose" style="margin-top:8px"></button>
  </div>
</div>
<div class="overlay" id="hist" hidden>
  <div class="sheet">
    <h3 id="histTitle"></h3>
    <div id="histList"></div>
    <div class="total"><span id="histTotalL"></span><span id="histTotal"></span></div>
    <p class="muted" id="histNote" style="font-size:13px"></p>
    <button class="btn sub" id="histClose"></button>
  </div>
</div>

<button id="callBtn" hidden style="position:fixed;left:12px;bottom:88px;z-index:5;border:0;border-radius:999px;padding:10px 16px;font-size:15px;font-weight:700;background:#fff;color:#a8261b;box-shadow:0 3px 10px rgba(0,0,0,.25)"></button>
<div class="overlay" id="callSheet" hidden>
  <div class="sheet">
    <h3 id="callTitle"></h3>
    <div id="callList"></div>
    <p id="callMsg" style="color:#1a7a3a;font-weight:700;min-height:1.2em;margin:10px 0 0"></p>
    <button class="btn sub" id="callClose"></button>
  </div>
</div>

<div class="bar" id="bar"><button class="btn" id="toConfirm" disabled data-t="pick">商品を選んでください</button></div>

<!-- 確認 -->
<div class="overlay" id="confirm" hidden>
  <div class="sheet">
    <h3 data-t="confirmTitle">ご注文内容の確認</h3>
    <div id="cartList"></div>
    <div class="total"><span data-t="total">合計（税込）</span><span id="cartTotal"></span></div>
    <p class="ask" data-t="callStaff">ご要望がある場合は、店員をお呼びください。</p>
    <p class="muted" data-t="payNote">お会計はお帰りの際にレジでお願いします。</p>
    <button class="btn" id="send" data-t="send">この内容で注文する</button>
    <button class="btn sub" id="back" data-t="back">戻る</button>
  </div>
</div>

<!-- お持ち帰り：お名前と受け取り時間 -->
<div class="overlay" id="askTo" hidden>
  <div class="sheet">
    <h3 data-t="toTitle">お持ち帰りのご注文</h3>
    <input id="toName" maxlength="20" autocomplete="name" placeholder="お名前" data-tp="toNamePh">
    <input id="toTel" type="tel" inputmode="tel" maxlength="15" autocomplete="tel" placeholder="電話番号" data-tp="toTelPh" style="margin-top:10px">
    <p class="muted" style="margin:12px 0 4px" data-t="toTimeNote">受け取り時間</p>
    <select id="toTime" style="width:100%;padding:12px;font-size:17px;border:1px solid #ccc;border-radius:10px;background:#fff"></select>
    <p class="muted" id="toHours" style="margin:6px 0 0;font-size:13px"><b>本日</b>のお受け取り分のみ承ります<br>受取時間 11:45〜14:30 / 17:30〜21:15（水曜定休）</p>
    <p id="toMsg" style="color:#c0281c;margin:8px 0 0"></p>
    <button class="btn" id="toOk" style="margin-top:12px" data-t="ok">決定</button>
  </div>
</div>

<!-- ご予約のお客様：お名前だけ -->
<div class="overlay" id="askRv" hidden>
  <div class="sheet">
    <h3>ご予約のお客様の事前注文</h3>
    <p class="muted" style="margin:4px 0 10px">ご予約のお名前を入れてください</p>
    <input id="rvName" maxlength="20" autocomplete="name" placeholder="お名前">
    <p id="rvMsg" style="color:#c0281c;margin:8px 0 0"></p>
    <button class="btn" id="rvOk" style="margin-top:12px">決定</button>
  </div>
</div>

<!-- テーブル番号入力 -->
<div class="overlay" id="askTable" hidden>
  <div class="sheet">
    <h3 data-t="askTable">テーブル番号を入力してください</h3>
    <input id="tblInput" hidden inputmode="numeric" maxlength="10" placeholder="例：3" data-tp="tablePh">
    <div class="tblq"><button type="button">1</button><button type="button">2</button><button type="button">3</button><button type="button">4</button><button type="button">5</button><button type="button">6</button><button type="button">7</button><button type="button">A</button><button type="button">B</button><button type="button">C</button><button type="button">D</button></div>
    <button class="btn" id="tblOk" hidden style="margin-top:12px" data-t="ok">決定</button>
  </div>
</div>

<!-- 完了 -->
<div class="overlay" id="thanks" hidden>
  <div class="sheet center">
    <div class="muted" data-t="thanks">ご注文を受け付けました</div>
    <div class="big" id="orderNo"></div>
    <p data-t="wait">お料理ができるまで少々お待ちください。</p>
    <button class="btn" id="again" data-t="again">追加で注文する</button>
  </div>
</div>

<script src="i18n.js?v=3"></script>
<script src="i18n2.js?v=22"></script>
<script>
  const API = document.body.dataset.api;
  async function call(params, body) {
    const opt = body ? { method: 'POST', body: JSON.stringify(body), credentials: 'omit' } : { credentials: 'omit' };
    const url = body ? API : API + '?' + new URLSearchParams(params).toString();
    let r, err;
    for (let i = 0; i < (body ? 1 : 3); i++) {
      try { r = await fetch(url, opt); break; } catch (e) { err = e; await new Promise(s => setTimeout(s, 1500)); }
    }
    if (!r) throw err;
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '通信エラー');
    return j.data;
  }
  const STAFF = new URLSearchParams(location.search).get('staff') === '1';
  const TAKEOUT = new URLSearchParams(location.search).get('takeout') === '1';
  let toInfo = '', toTel = '';
  // 予約のお客様の事前注文（table=8）：お名前だけ入れてもらう
  const RESV = !TAKEOUT && !STAFF && (new URLSearchParams(location.search).get('table') || '') === '8';
  let rvName = '';
  let table = TAKEOUT ? '持帰' : STAFF ? '' : (new URLSearchParams(location.search).get('table') || '').slice(0, 10);
  let menu = [];
  let rid = null;
  const cart = {};
  const $ = id => document.getElementById(id);
  const yen = n => '¥' + Number(n).toLocaleString();

  // ===== 言語切り替え（お店に届く注文は常に日本語の商品名） =====
  const I = window.I18N || { items: {}, cats: {}, ui: {} };
  const LANGS = [['ja', '日本語', 'ja'], ['en', 'English', 'en'], ['zhs', '简体中文', 'zh-Hans'], ['zht', '繁體中文', 'zh-Hant']];
  function detectLang() {
    const q = new URLSearchParams(location.search).get('lang');
    if (LANGS.some(l => l[0] === q)) return q;
    try { const s = localStorage.getItem('kouju_lang'); if (LANGS.some(l => l[0] === s)) return s; } catch (e) {}
    for (const raw of (navigator.languages || [navigator.language || 'ja'])) {
      const l = String(raw).toLowerCase();
      if (l.startsWith('ja')) return 'ja';
      if (l.startsWith('zh')) return /hant|tw|hk|mo/.test(l) ? 'zht' : 'zhs';
      if (l.startsWith('en')) return 'en';
    }
    return 'en';
  }
  let lang = detectLang();
  const T = (k, v) => {
    const e = I.ui[k];
    let s = e ? (e[lang] !== undefined ? e[lang] : e.ja) : k;
    Object.entries(v || {}).forEach(([a, b]) => { s = s.split('{' + a + '}').join(b); });
    return s;
  };
  const JDISP = { 'ライス 小碗': 'ライス小', 'ライス 御碗': 'ライス中', 'ライス 大盛': 'ライス大' };
  const N = name => ((lang !== 'ja' && I.items[name] && I.items[name][lang]) || (lang === 'ja' && JDISP[name]) || name).replace(/^【持帰】/, '');
  const XC = { 'ご予約': { en: 'Reservations', zhs: '预约', zht: '預約' }, 'テイクアウト': { en: 'Takeout', zhs: '外带', zht: '外帶' } };
  const C = cat => (XC[cat] && XC[cat][lang]) || (I.cats[cat] && I.cats[cat][lang]) || cat;
  function applyLang() {
    document.documentElement.lang = LANGS.find(l => l[0] === lang)[2];
    document.title = T('title');
    document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = T(el.dataset.t); });
    document.querySelectorAll('[data-tp]').forEach(el => { el.placeholder = T(el.dataset.tp); });
    if (TAKEOUT) $('tblLabel').textContent = T('toLabel', { t: toInfo || '—' });
    else if (RESV) $('tblLabel').textContent = 'ご予約：' + (rvName ? rvName + ' 様' : '—');
    else if (table) $('tblLabel').textContent = T('table', { t: table });
    const box = $('langs'); box.innerHTML = '';
    LANGS.forEach(([code, label, tag]) => {
      const b = document.createElement('button'); b.textContent = label; b.lang = tag;
      b.classList.toggle('on', code === lang);
      b.onclick = () => {
        if (code === lang) return;
        lang = code;
        try { localStorage.setItem('kouju_lang', code); } catch (e) {}
        applyLang();
        if (menu.length) renderMenu();
        updateBar();
        if (!$('confirm').hidden) $('toConfirm').onclick();
      };
      box.appendChild(b);
    });
  }

  function setTable(t) { table = t; $('tblLabel').textContent = T('table', { t }) + (STAFF ? '（タップで変更）' : ''); }
  if (STAFF) $('tblLabel').onclick = () => { $('tblInput').value = ''; $('askTable').hidden = false; };
  applyLang();
  if (table) setTable(table); else $('askTable').hidden = false;
  $('tblOk').onclick = () => {
    const v = $('tblInput').value.trim().replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).toUpperCase();
    if (v) { setTable(v); $('askTable').hidden = true; }
  };
  document.querySelectorAll('.tblq button').forEach(b => b.onclick = () => { setTable(b.textContent); $('askTable').hidden = true; });
  if (TAKEOUT) {
    const h1 = document.querySelector('header h1'); h1.dataset.t = 'toAppTitle'; h1.innerHTML = T('toAppTitle'); document.title = T('toAppTitle');
    const pn = document.querySelector('[data-t="payNote"]'); if (pn) { pn.dataset.t = 'payTo'; pn.innerHTML = T('payTo'); }
    $('tblLabel').textContent = T('toLabel', { t: '—' });
    $('tblLabel').onclick = () => { $('askTo').hidden = false; };
    $('askTo').hidden = false;
    // 受け取り時間：11:45〜14:30 / 17:30〜21:15、水曜定休。今から15分後以降を15分刻みで選べる
    (function fillTimes() {
      const sel = $('toTime'); sel.innerHTML = '';
      const now = new Date(); const jst = new Date(now.getTime() + (now.getTimezoneOffset() + 540) * 60000);
      const msg = $('toMsg');
      window.TODAY = (jst.getMonth() + 1) + '/' + jst.getDate() + '(' + '日月火水木金土'[jst.getDay()] + ')';
      { const p = document.createElement('p'); p.style.cssText = 'margin:4px 0 6px;font-weight:700;font-size:16px'; p.textContent = '受け取り日：本日 ' + window.TODAY; sel.before(p); }
      if (jst.getDay() === 3) { sel.innerHTML = '<option value="">本日は定休日です</option>'; sel.disabled = true; $('toOk').disabled = true; msg.textContent = '水曜日は定休日のため、本日のご注文は承れません。'; return; }
      const nowMin = jst.getHours() * 60 + jst.getMinutes() + 15;
      const ranges = [[11 * 60 + 45, 14 * 60 + 30], [17 * 60 + 30, 21 * 60 + 15]];
      const opts = [];
      ranges.forEach(([a, b]) => { for (let m = a; m <= b; m += 15) if (m >= nowMin) opts.push(m); });
      if (!opts.length) { sel.innerHTML = '<option value="">本日の受付は終了しました</option>'; sel.disabled = true; $('toOk').disabled = true; msg.textContent = '本日の受付は終了しました。またのご利用をお待ちしております。'; return; }
      sel.innerHTML = '<option value="">本日（' + (jst.getMonth() + 1) + '/' + jst.getDate() + '）の受け取り時間を選んでください</option>' + opts.map(m => { const t = String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); return '<option value="' + t + '">' + t + '</option>'; }).join('');
    })();
    $('toOk').onclick = () => {
      const n = $('toName').value.trim(), tm = $('toTime').value, tel = $('toTel').value.replace(/[^0-9０-９+\-－]/g, '');
      if (!n || !tm || tel.replace(/[^0-9０-９]/g, '').length < 10) { $('toMsg').textContent = T('toNeed'); return; }
      toTel = tel;
      toInfo = n + '様 ' + (window.TODAY || '') + ' ' + tm; $('toMsg').textContent = '';
      $('tblLabel').textContent = T('toLabel', { t: toInfo });
      $('askTo').hidden = true;
    };
  }
  if (RESV) {
    $('tblLabel').textContent = 'ご予約：—';
    $('tblLabel').onclick = () => { $('askRv').hidden = false; };
    $('askRv').hidden = false;
    $('rvOk').onclick = () => {
      const n = $('rvName').value.trim();
      if (!n) { $('rvMsg').textContent = 'お名前を入れてください'; return; }
      rvName = n; $('rvMsg').textContent = '';
      $('tblLabel').textContent = 'ご予約：' + rvName + ' 様';
      $('askRv').hidden = true;
    };
  }

  // 前回のメニューがあれば先に表示し、裏で最新に更新する
  try {
    const cached = JSON.parse(localStorage.getItem('kouju_menu') || 'null');
    if (Array.isArray(cached) && cached.length) { menu = cached; setTimeout(renderMenu, 0); }
  } catch (e) {}
  call({ api: 'menu' })
    .then(m => {
      const fresh = JSON.stringify(m);
      if (fresh !== JSON.stringify(menu)) { menu = m; renderMenu(); }
      try { localStorage.setItem('kouju_menu', fresh); } catch (e) {}
    })
    .catch(() => { if (!menu.length) $('menu').innerHTML = '<p class="center">' + T('loadFail') + '</p>'; });

  // 大分類（お店のメニューの並び）
  const GROUPS = [
    ['テイクアウト 飯類', ['テイクアウト 飯類']],
    ['テイクアウト 餃子', ['テイクアウト 餃子']],
    ['テイクアウト その他', ['テイクアウト その他']],
    ['ランチ', ['ランチ', 'ランチ サイド', 'ランチ限定 お得ドリンク']],

    zhs: { intro: '接受大闸蟹・年菜预约。提交后店家会致电确认。', crab: '大闸蟹预约', osechi: '年菜预约', toIntro: '外带请使用外带专用页面。', toBtn: '打开外带页面', name: '姓名', tel: '电话', date: '希望日期', rdate: '取货日期', time: '希望时间', ppl: '人数', male: '公蟹（只）', female: '母蟹（只）', qty: '数量', memo: '要求（可不填）', send: '提交预约', close: '关闭', need: '请填写姓名・电话・日期', ok: '已收到预约申请，店家会致电确认。', fail: '发送失败，请致电 045-298-9091', wed: '周三休息' },
    zht: { intro: '接受大閘蟹・年菜預約。提交後店家會致電確認。', crab: '大閘蟹預約', osechi: '年菜預約', toIntro: '外帶請使用外帶專用頁面。', toBtn: '打開外帶頁面', name: '姓名', tel: '電話', date: '希望日期', rdate: '取貨日期', time: '希望時間', ppl: '人數', male: '公蟹（隻）', female: '母蟹（隻）', qty: '數量', memo: '要求（可不填）', send: '提交預約', close: '關閉', need: '請填寫姓名・電話・日期', ok: '已收到預約申請，店家會致電確認。', fail: '發送失敗，請致電 045-298-9091', wed: '週三休息' } };
  function RS(k) { return (RT[lang] || RT.ja)[k]; }
  function openRsv(kind) {
    const f = $('rsvForm'); f.innerHTML = ''; $('rsvMsg').textContent = '';
    const row = (label, el) => { const l = document.createElement('label'); l.style.cssText = 'display:block;margin:8px 0 2px;font-size:14px;font-weight:700'; l.textContent = label; f.append(l, el); return el; };
    const inp = (type, ph) => { const e = document.createElement('input'); e.type = type; if (ph) e.placeholder = ph; e.style.cssText = 'width:100%;box-sizing:border-box'; return e; };
    const sel = (opts) => { const e = document.createElement('select'); e.style.cssText = 'width:100%;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:10px;background:#fff'; opts.forEach(o => { const op = document.createElement('option'); op.value = op.textContent = o; e.appendChild(op); }); return e; };
    const nums = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => String(a + i));
    const F = {};
    F.name = row(RS('name'), inp('text')); F.name.maxLength = 20;
    F.tel = row(RS('tel'), inp('tel')); F.tel.inputMode = 'tel'; F.tel.maxLength = 15;
    F.date = row(kind === 'crab' ? RS('date') : RS('rdate'), inp('date'));
    if (kind === 'crab') {
      F.time = row(RS('time'), sel(['11:30', '12:00', '12:30', '13:00', '17:30', '18:00', '18:30', '19:00', '19:30', '20:00']));
      F.ppl = row(RS('ppl'), sel(nums(1, 12))); F.ppl.value = '2';
      F.male = row(RS('male'), sel(nums(0, 20))); F.female = row(RS('female'), sel(nums(0, 20)));
    } else { F.qty = row(RS('qty'), sel(nums(1, 10))); }
    F.memo = row(RS('memo'), inp('text')); F.memo.maxLength = 60;
    $('rsvTitle').textContent = (kind === 'crab' ? '🦀 ' : '🎍 ') + RS(kind === 'crab' ? 'crab' : 'osechi');
    $('rsvSend').textContent = RS('send'); $('rsvSend').disabled = false; $('rsvClose').textContent = RS('close');
    $('rsvSend').onclick = () => {
      const n = F.name.value.trim(), tel = F.tel.value.replace(/[^0-9０-９+\-－]/g, ''), d = F.date.value;
      if (!n || tel.replace(/[^0-9０-９]/g, '').length < 10 || !d) { $('rsvMsg').textContent = RS('need'); return; }
      const dt = new Date(d + 'T12:00:00'); if (dt.getDay() === 3) { $('rsvMsg').textContent = RS('wed'); return; }
      const ds = (dt.getMonth() + 1) + '/' + dt.getDate() + '(' + '日月火水木金土'[dt.getDay()] + ')';
      const note = (kind === 'crab'
        ? '【上海蟹予約】' + n + '様 TEL ' + tel + ' ' + ds + ' ' + F.time.value + ' ' + F.ppl.value + '名 オス' + F.male.value + ' メス' + F.female.value
        : '【おせち予約】' + n + '様 TEL ' + tel + ' 受取' + ds + ' ' + F.qty.value + '個') + (F.memo.value.trim() ? ' / ' + F.memo.value.trim() : '');
      $('rsvSend').disabled = true;
      call(null, { action: 'order', rid: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), table: '予約', items: [{ name: kind === 'crab' ? '【予約】上海蟹' : '【予約】おせち', qty: 1 }], note: note.slice(0, 200) })
        .then(() => { $('rsvMsg').style.color = '#1a7a3a'; $('rsvMsg').textContent = RS('ok'); })
        .catch(() => { $('rsvMsg').style.color = '#c0281c'; $('rsvMsg').textContent = RS('fail'); $('rsvSend').disabled = false; });
    };
    $('rsvSheet').hidden = false;
  }
  $('rsvClose').onclick = () => { $('rsvSheet').hidden = true; };

  // ===== 注文履歴（この端末で今日注文した分） =====
  const HT = { ja: ['🧾 注文履歴', '注文履歴', '合計', 'この端末から本日ご注文いただいた内容です', '閉じる'], en: ['🧾 My orders', 'Your orders today', 'Total', 'Orders placed from this phone today', 'Close'], zhs: ['🧾 点单记录', '今日点单记录', '合计', '本手机今天的点单', '关闭'], zht: ['🧾 點單紀錄', '今日點單紀錄', '合計', '本手機今天的點單', '關閉'] };
  const ht = i => (HT[lang] || HT.ja)[i];
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
  function loadHist() {
    try { return (JSON.parse(localStorage.getItem('kouju_hist') || '[]') || []).filter(h => h.d === today() && h.table === table); } catch (e) { return []; }
  }
  function saveHist(no, items) {
    try {
      const all = (JSON.parse(localStorage.getItem('kouju_hist') || '[]') || []).filter(h => h.d === today());
      const d = new Date();
      all.push({ d: today(), table, no, t: String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'), items: items.map(i => ({ name: i.name, qty: i.qty, price: i.price })) });
      localStorage.setItem('kouju_hist', JSON.stringify(all));
    } catch (e) {}
    showHistBtn();
  }
  function showHistBtn() { const h = loadHist(); $('histBtn').hidden = !h.length || STAFF; $('histBtn').textContent = ht(0); }
  $('histBtn').onclick = () => {
    const h = loadHist(); const box = $('histList'); box.innerHTML = ''; let sum = 0;
    h.forEach(o => {
      const head = document.createElement('div'); head.style.cssText = 'margin:10px 0 4px;font-weight:700;color:#a8261b'; head.textContent = 'No.' + o.no + '　' + o.t; box.appendChild(head);
      o.items.forEach(i => {
        const r = document.createElement('div'); r.style.cssText = 'display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid #eee';
        const nm = document.createElement('span'); nm.textContent = (typeof N === 'function' ? N(i.name) : i.name) + ' ×' + i.qty;
        const pr = document.createElement('span'); pr.textContent = yen(i.price * i.qty); pr.style.whiteSpace = 'nowrap';
        r.append(nm, pr); box.appendChild(r); sum += i.price * i.qty;
      });
    });
    $('histTitle').textContent = ht(1); $('histTotalL').textContent = ht(2); $('histTotal').textContent = yen(sum);
    $('histNote').textContent = ht(3); $('histClose').textContent = ht(4);
    $('hist').hidden = false;
  };
  $('histClose').onclick = () => { $('hist').hidden = true; };
  setTimeout(showHistBtn, 0);
  document.addEventListener('click', e => { if (e.target && e.target.closest && e.target.closest('#langs')) setTimeout(showHistBtn, 50); });
  // ===== 呼び出し（店員を呼ぶ・取り皿・お水） =====
  const CT = { ja: ['🙋 呼び出し', '店員への呼び出し', '店員を呼ぶ', '取り皿', 'お水', '頼む', 'お店に伝えました。少々お待ちください', '閉じる', '送れませんでした。店員をお呼びください', '枚', '杯'],
    en: ['🙋 Call staff', 'Call staff', 'Call a staff member', 'Small plates', 'Water', 'Send', 'Sent! Please wait a moment', 'Close', 'Could not send. Please call a staff member', '', ''],
    zhs: ['🙋 呼叫', '呼叫服务员', '呼叫服务员', '小碟子', '水', '发送', '已通知店员，请稍候', '关闭', '发送失败，请呼叫服务员', '个', '杯'],
    zht: ['🙋 呼叫', '呼叫服務員', '呼叫服務員', '小碟子', '水', '發送', '已通知店員，請稍候', '關閉', '發送失敗，請呼叫服務員', '個', '杯'] };
  const ct = i => (CT[lang] || CT.ja)[i];
  const CALLS = [['【呼出】店員を呼ぶ', 2, false, ''], ['【呼出】取り皿', 3, true, 9], ['【呼出】お水', 4, true, 10]];
  function showCallBtn() { $('callBtn').hidden = TAKEOUT || STAFF || (typeof RESV !== 'undefined' && RESV) || !table; $('callBtn').textContent = ct(0); }
  $('callBtn').onclick = () => {
    const box = $('callList'); box.innerHTML = ''; $('callMsg').textContent = '';
    CALLS.forEach(([name, li, hasQty, unitI]) => {
      const row = document.createElement('div'); row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee';
      const lb = document.createElement('div'); lb.style.cssText = 'flex:1;font-size:17px;font-weight:700'; lb.textContent = ct(li); row.appendChild(lb);
      let q = 1;
      if (hasQty) {
        const mk = (s, d) => { const b = document.createElement('button'); b.textContent = s; b.style.cssText = 'width:38px;height:38px;border-radius:50%;border:1px solid #ccc;background:#fff;font-size:20px'; b.onclick = () => { q = Math.max(1, Math.min(10, q + d)); qn.textContent = q + ct(unitI); }; return b; };
        const qn = document.createElement('span'); qn.style.cssText = 'min-width:40px;text-align:center;font-size:17px'; qn.textContent = q + ct(unitI);
        row.append(mk('−', -1), qn, mk('+', 1));
      }
      const go = document.createElement('button'); go.className = 'btn'; go.style.cssText = 'width:auto;padding:10px 16px;margin:0'; go.textContent = ct(5);
      go.onclick = () => {
        go.disabled = true;
        call(null, { action: 'order', rid: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), table, items: [{ name, qty: q }], note: '' })
          .then(() => { $('callMsg').style.color = '#1a7a3a'; $('callMsg').textContent = ct(6); setTimeout(() => { go.disabled = false; }, 5000); })
          .catch(() => { $('callMsg').style.color = '#c0281c'; $('callMsg').textContent = ct(8); go.disabled = false; });
      };
      row.appendChild(go); box.appendChild(row);
    });
    $('callTitle').textContent = ct(1); $('callClose').textContent = ct(7); $('callSheet').hidden = false;
  };
  $('callClose').onclick = () => { $('callSheet').hidden = true; };
  setTimeout(showCallBtn, 0); setInterval(showCallBtn, 3000);
  $('again').onclick = () => { $('thanks').hidden = true; window.scrollTo(0, 0); if (STAFF) { $('tblInput').value = ''; $('askTable').hidden = false; } };
</script>

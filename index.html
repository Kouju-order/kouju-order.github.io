<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<title>公珠 モバイルオーダー</title>
<style>
  :root { --red:#a8231b; --ink:#231f1c; --muted:#7a716a; --bg:#f8f4ee; --card:#fff; --line:#e7dfd4; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--ink); padding-bottom:110px; }
  header { background:var(--red); color:#fff; padding:16px 16px 14px; }
  header h1 { margin:0; font-size:21px; letter-spacing:.05em; }
  html[lang^="zh-Hans"] body { font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif; }
  html[lang^="zh-Hant"] body { font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; }
  .langs { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .langs button { border:1px solid rgba(255,255,255,.7); background:transparent; color:#fff; border-radius:999px; padding:5px 11px; font-size:13px; font-weight:700; }
  .langs button.on { background:#fff; color:var(--red); border-color:#fff; }
  header .tbl { margin-top:4px; font-size:14px; opacity:.92; }
  main { padding:4px 16px; }
  .tabs { position:sticky; top:0; z-index:5; display:flex; gap:8px; overflow-x:auto; padding:10px 16px; background:var(--bg); border-bottom:1px solid var(--line); -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tabs[hidden] { display:none; }
  .tabs button { flex:0 0 auto; border:1.5px solid var(--red); background:#fff; color:var(--red); border-radius:999px; padding:8px 14px; font-size:15px; font-weight:700; white-space:nowrap; }
  .tabs button.on { background:var(--red); color:#fff; }
  .group { scroll-margin-top:64px; }
  h3.grp { font-size:19px; margin:26px 0 4px; color:var(--ink); }
  h2 { font-size:15px; color:var(--red); margin:22px 0 8px; padding-bottom:6px; border-bottom:2px solid var(--line); }
  .item { display:flex; align-items:center; gap:12px; background:var(--card); border-radius:12px; padding:14px; margin-bottom:8px; }
  .item .info { flex:1; min-width:0; }
  .item .name { font-size:16px; font-weight:600; }
  .item .ja { font-size:12px; color:var(--muted); margin-top:2px; }
  .item .ja:empty { display:none; }
  .item .price { font-size:14px; color:var(--muted); margin-top:2px; }
  .row .ja { display:block; font-size:12px; color:var(--muted); }
  .step { display:flex; align-items:center; gap:8px; }
  .step button { width:38px; height:38px; border-radius:50%; border:1.5px solid var(--red); background:#fff; color:var(--red); font-size:22px; line-height:1; }
  .step button.plus { background:var(--red); color:#fff; }
  .step .q { min-width:20px; text-align:center; font-size:17px; font-weight:700; }
  .step button.minus[hidden], .step .q[hidden] { display:none; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:#fff; border-top:1px solid var(--line); }
  .btn { width:100%; border:0; border-radius:12px; background:var(--red); color:#fff; font-size:17px; font-weight:700; padding:15px; }
  .btn:disabled { background:#c9bfb5; }
  .btn.sub { background:#fff; color:var(--red); border:1.5px solid var(--red); margin-top:10px; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; z-index:10; }
  .overlay[hidden] { display:none; }
  .sheet { background:var(--bg); width:100%; max-height:88vh; overflow:auto; border-radius:18px 18px 0 0; padding:20px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin:0 0 12px; font-size:18px; }
  .row { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .total { display:flex; justify-content:space-between; font-size:18px; font-weight:700; margin:14px 0; }
  textarea, input { width:100%; font-size:16px; padding:10px; border:1px solid var(--line); border-radius:10px; font-family:inherit; }
  .center { text-align:center; padding:40px 8px; }
  .big { font-size:44px; font-weight:800; color:var(--red); margin:8px 0; }
  .muted { color:var(--muted); font-size:14px; }
</style>
</head>
<body data-api="https://script.google.com/macros/s/AKfycbwa-2vEjFBCXPFlnAeDj183ezOX0XGquyYTlFIgafLjcIAuQXsEXa7PYhIan-4oa4ildg/exec">
<header>
  <h1 data-t="title">公珠 モバイルオーダー</h1>
  <div class="tbl" id="tblLabel"></div>
  <div class="langs" id="langs"></div>
</header>
<nav class="tabs" id="tabs" hidden></nav>
<main id="menu"><p class="muted center" data-t="loading">メニューを読み込み中…</p></main>

<div class="bar" id="bar"><button class="btn" id="toConfirm" disabled data-t="pick">商品を選んでください</button></div>

<!-- 確認 -->
<div class="overlay" id="confirm" hidden>
  <div class="sheet">
    <h3 data-t="confirmTitle">ご注文内容の確認</h3>
    <div id="cartList"></div>
    <div class="total"><span data-t="total">合計（税込）</span><span id="cartTotal"></span></div>
    <textarea id="note" rows="2" maxlength="200" placeholder="ご要望（任意）例：辛さ控えめ" data-tp="notePh"></textarea>
    <p class="muted" data-t="payNote">お会計はお帰りの際にレジでお願いします。</p>
    <button class="btn" id="send" data-t="send">この内容で注文する</button>
    <button class="btn sub" id="back" data-t="back">戻る</button>
  </div>
</div>

<!-- テーブル番号入力 -->
<div class="overlay" id="askTable" hidden>
  <div class="sheet">
    <h3 data-t="askTable">テーブル番号を入力してください</h3>
    <input id="tblInput" inputmode="numeric" maxlength="10" placeholder="例：3" data-tp="tablePh">
    <button class="btn" id="tblOk" style="margin-top:12px" data-t="ok">決定</button>
  </div>
</div>

<!-- 完了 -->
<div class="overlay" id="thanks" hidden>
  <div class="sheet center">
    <div class="muted" data-t="thanks">ご注文を受け付けました</div>
    <div class="big" id="orderNo"></div>
    <p data-t="wait">お料理ができるまで少々お待ちください。</p>
    <button class="btn" id="again" data-t="again">追加で注文する</button>
  </div>
</div>

<script src="i18n.js?v=1"></script>
<script src="i18n2.js?v=2"></script>
<script>
  const API = document.body.dataset.api;
  async function call(params, body) {
    const opt = body ? { method: 'POST', body: JSON.stringify(body), credentials: 'omit' } : { credentials: 'omit' };
    const url = body ? API : API + '?' + new URLSearchParams(params).toString();
    let r, err;
    for (let i = 0; i < (body ? 1 : 3); i++) {
      try { r = await fetch(url, opt); break; } catch (e) { err = e; await new Promise(s => setTimeout(s, 1500)); }
    }
    if (!r) throw err;
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '通信エラー');
    return j.data;
  }
  let table = (new URLSearchParams(location.search).get('table') || '').slice(0, 10);
  let menu = [];
  let rid = null;
  const cart = {};
  const $ = id => document.getElementById(id);
  const yen = n => '¥' + Number(n).toLocaleString();

  // ===== 言語切り替え（お店に届く注文は常に日本語の商品名） =====
  const I = window.I18N || { items: {}, cats: {}, ui: {} };
  const LANGS = [['ja', '日本語', 'ja'], ['en', 'English', 'en'], ['zhs', '简体中文', 'zh-Hans'], ['zht', '繁體中文', 'zh-Hant']];
  function detectLang() {
    const q = new URLSearchParams(location.search).get('lang');
    if (LANGS.some(l => l[0] === q)) return q;
    try { const s = localStorage.getItem('kouju_lang'); if (LANGS.some(l => l[0] === s)) return s; } catch (e) {}
    for (const raw of (navigator.languages || [navigator.language || 'ja'])) {
      const l = String(raw).toLowerCase();
      if (l.startsWith('ja')) return 'ja';
      if (l.startsWith('zh')) return /hant|tw|hk|mo/.test(l) ? 'zht' : 'zhs';
      if (l.startsWith('en')) return 'en';
    }
    return 'en';
  }
  let lang = detectLang();
  const T = (k, v) => {
    const e = I.ui[k];
    let s = e ? (e[lang] !== undefined ? e[lang] : e.ja) : k;
    Object.entries(v || {}).forEach(([a, b]) => { s = s.split('{' + a + '}').join(b); });
    return s;
  };
  const N = name => (lang !== 'ja' && I.items[name] && I.items[name][lang]) || name;
  const C = cat => (lang !== 'ja' && I.cats[cat] && I.cats[cat][lang]) || cat;
  function applyLang() {
    document.documentElement.lang = LANGS.find(l => l[0] === lang)[2];
    document.title = T('title');
    document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = T(el.dataset.t); });
    document.querySelectorAll('[data-tp]').forEach(el => { el.placeholder = T(el.dataset.tp); });
    if (table) $('tblLabel').textContent = T('table', { t: table });
    const box = $('langs'); box.innerHTML = '';
    LANGS.forEach(([code, label, tag]) => {
      const b = document.createElement('button'); b.textContent = label; b.lang = tag;
      b.classList.toggle('on', code === lang);
      b.onclick = () => {
        if (code === lang) return;
        lang = code;
        try { localStorage.setItem('kouju_lang', code); } catch (e) {}
        applyLang();
        if (menu.length) renderMenu();
        updateBar();
        if (!$('confirm').hidden) $('toConfirm').onclick();
      };
      box.appendChild(b);
    });
  }

  function setTable(t) { table = t; $('tblLabel').textContent = T('table', { t }); }
  applyLang();
  if (table) setTable(table); else $('askTable').hidden = false;
  $('tblOk').onclick = () => {
    const v = $('tblInput').value.trim();
    if (v) { setTable(v); $('askTable').hidden = true; }
  };

  // 前回のメニューがあれば先に表示し、裏で最新に更新する
  try {
    const cached = JSON.parse(localStorage.getItem('kouju_menu') || 'null');
    if (Array.isArray(cached) && cached.length) { menu = cached; setTimeout(renderMenu, 0); }
  } catch (e) {}
  call({ api: 'menu' })
    .then(m => {
      const fresh = JSON.stringify(m);
      if (fresh !== JSON.stringify(menu)) { menu = m; renderMenu(); }
      try { localStorage.setItem('kouju_menu', fresh); } catch (e) {}
    })
    .catch(() => { if (!menu.length) $('menu').innerHTML = '<p class="center">' + T('loadFail') + '</p>'; });

  // 大分類（お店のメニューの並び）
  const GROUPS = [
    ['ランチ', ['ランチ', 'ランチ サイド', 'ランチ 生ビール']],
    ['黒板メニュー', ['黒板メニュー', '黒ビール（3種の黒ビールシリーズ）', '白酒（ミニボトル）']],
    ['餃子', ['餃子', '焼餃子', '水餃子']],
    ['ワンタン', ['ワンタン', '雲呑', '揚げ雲呑']],
    ['麺類', ['麺類']],
    ['ご飯類', ['ご飯類']],
    ['焼きそば', ['焼きそば']],
    ['一品料理', ['一品料理', '麻婆豆腐', '野菜料理', '鶏・牛料理', 'エビ料理', '卵料理']],
    ['点心', ['点心', '小菜・点心']],
    ['前菜', ['前菜']],
    ['デザート', ['デザート']],
    ['中国茶', ['中国茶', '中国茶（お一人様用）']],
    ['サワー', ['サワー']],
    ['ビール', ['ビール', '生ビール', '瓶ビール・ビアカクテル']],
    ['その他', ['その他', 'ハイボール', 'ウイスキー（ストレート・水割り・ロック）', '焼酎', 'リキュール', '紹興酒・白酒・日本酒・ワイン']],
    ['ソフトドリンク', ['ソフトドリンク', '健康ドリンク']],
  ];
  const groupOf = cat => { const g = GROUPS.find(([, cs]) => cs.includes(cat)); return g ? g[0] : 'その他'; };

  function renderMenu() {
    const root = $('menu');
    root.innerHTML = '';
    if (!menu.length) { root.innerHTML = '<p class="center muted">' + T('empty') + '</p>'; return; }
    const cats = [];
    menu.forEach(m => { if (!cats.includes(m.cat)) cats.push(m.cat); });
    const usedGroups = [];
    let curGroup = null, wrap = null;
    cats.forEach(cat => {
      const gname = groupOf(cat);
      if (gname !== curGroup) {
        curGroup = gname;
        wrap = document.createElement('section'); wrap.className = 'group'; wrap.id = 'g' + usedGroups.length;
        wrap.dataset.group = gname;
        const gh = document.createElement('h3'); gh.className = 'grp'; gh.textContent = C(gname); wrap.appendChild(gh);
        root.appendChild(wrap);
        usedGroups.push(gname);
      }
      if (cat !== gname) { const h = document.createElement('h2'); h.textContent = C(cat); wrap.appendChild(h); }
      menu.filter(m => m.cat === cat).forEach(m => {
        const el = document.createElement('div'); el.className = 'item';
        el.innerHTML = '<div class="info"><div class="name"></div><div class="ja" lang="ja"></div><div class="price"></div></div>' +
          '<div class="step"><button class="minus">−</button><span class="q"></span><button class="plus">＋</button></div>';
        el.querySelector('.minus').setAttribute('aria-label', T('less'));
        el.querySelector('.plus').setAttribute('aria-label', T('more'));
        const shown = N(m.name);
        el.querySelector('.name').textContent = shown;
        el.querySelector('.ja').textContent = shown !== m.name ? m.name : '';
        el.querySelector('.price').textContent = m.price > 0 ? yen(m.price) : T('askPrice');
        const q = el.querySelector('.q'), minus = el.querySelector('.minus');
        const sync = () => { const n = cart[m.name] || 0; q.textContent = n; q.hidden = minus.hidden = n === 0; updateBar(); };
        el.querySelector('.plus').onclick = () => { cart[m.name] = Math.min(50, (cart[m.name] || 0) + 1); sync(); };
        minus.onclick = () => { cart[m.name] = Math.max(0, (cart[m.name] || 0) - 1); if (!cart[m.name]) delete cart[m.name]; sync(); };
        sync();
        wrap.appendChild(el);
      });
    });
    renderTabs(usedGroups);
  }

  function renderTabs(groups) {
    const bar = $('tabs');
    bar.innerHTML = '';
    groups.forEach((g, i) => {
      const b = document.createElement('button'); b.textContent = C(g); b.dataset.i = i;
      b.onclick = () => { $('g' + i).scrollIntoView({ behavior: 'smooth', block: 'start' }); setActive(i); };
      bar.appendChild(b);
    });
    bar.hidden = groups.length < 2;
    setActive(0);
  }
  let activeTab = -1;
  function setActive(i) {
    if (i === activeTab) return;
    activeTab = i;
    const bar = $('tabs');
    [...bar.children].forEach((b, k) => b.classList.toggle('on', k === i));
    const b = bar.children[i];
    if (b) bar.scrollTo({ left: b.offsetLeft - 16, behavior: 'smooth' });
  }
  window.addEventListener('scroll', () => {
    const secs = document.querySelectorAll('section.group');
    let cur = 0;
    secs.forEach((s, i) => { if (s.getBoundingClientRect().top <= 80) cur = i; });
    setActive(cur);
  }, { passive: true });

  function cartItems() {
    return Object.keys(cart).map(name => {
      const m = menu.find(x => x.name === name);
      return { name, qty: cart[name], price: m ? m.price : 0 };
    });
  }

  function updateBar() {
    const items = cartItems();
    const count = items.reduce((a, i) => a + i.qty, 0);
    const total = items.reduce((a, i) => a + i.qty * i.price, 0);
    const b = $('toConfirm');
    b.disabled = count === 0;
    b.textContent = count ? T('review', { n: count, y: yen(total) }) : T('pick');
  }

  $('toConfirm').onclick = () => {
    if (!table) { $('askTable').hidden = false; return; }
    const list = $('cartList'); list.innerHTML = '';
    let total = 0;
    cartItems().forEach(i => {
      total += i.qty * i.price;
      const r = document.createElement('div'); r.className = 'row';
      const a = document.createElement('span'); a.textContent = `${N(i.name)} × ${i.qty}`;
      if (N(i.name) !== i.name) { const j = document.createElement('span'); j.className = 'ja'; j.lang = 'ja'; j.textContent = i.name; a.appendChild(j); }
      const b = document.createElement('span'); b.textContent = i.price > 0 ? yen(i.qty * i.price) : '—';
      r.append(a, b); list.appendChild(r);
    });
    $('cartTotal').textContent = yen(total);
    $('confirm').hidden = false;
  };
  $('back').onclick = () => { $('confirm').hidden = true; };

  $('send').onclick = () => {
    const btn = $('send');
    btn.disabled = true; btn.textContent = T('sending');
    rid = rid || (Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
    // お店側（iPad・メール）には日本語の商品名で届く。外国語のお客様は備考の先頭に言語を付ける
    const tag = T('noteTag');
    const note = (tag ? '【' + tag + '】' : '') + $('note').value;
    call(null, { action: 'order', rid, table, items: cartItems().map(i => ({ name: i.name, qty: i.qty })), note })
      .then(r => {
        rid = null;
        Object.keys(cart).forEach(k => delete cart[k]);
        $('note').value = '';
        renderMenu();
        $('confirm').hidden = true;
        $('orderNo').textContent = T('orderNo', { n: r.no });
        $('thanks').hidden = false;
        btn.disabled = false; btn.textContent = T('send');
      })
      .catch(e => {
        alert(T('sendFail') + (lang === 'ja' && e && e.message ? e.message : T('retry')));
        btn.disabled = false; btn.textContent = T('send');
      });
  };
  $('again').onclick = () => { $('thanks').hidden = true; window.scrollTo(0, 0); };
</script>
</body>
</html>
